# bootstrap.properties — loaded before application.properties by Spring Cloud
# Enables GCP Secret Manager as a configuration source so that secrets can be
# referenced in application.properties as ${sm://secret-name}.
#
# blocker-8, blocker-9, blocker-18: Database credentials and service credentials
# are resolved from Secret Manager at startup — no hard-coded values in source code.
#
# Example Secret Manager references (uncomment and configure for production):
#   spring.datasource.password=${sm://db-password}
#   app.payment.endpoint=${sm://payment-api-url}
#   app.report.download.url=${sm://report-download-url}

spring.application.name=ResortsLite
spring.cloud.gcp.secretmanager.enabled=true
spring.config.import=optional:sm://
