# bootstrap.properties — loaded before application context to enable
# GCP Secret Manager placeholder resolution (${sm://secret-name}).
# Required by Spring Cloud GCP Secret Manager (fixes cr-java-0069, cr-java-0090).

spring.application.name=ResortsLite

# Enable Spring Cloud GCP Secret Manager bootstrap integration.
spring.cloud.gcp.secretmanager.enabled=true

# GCP project ID — set via environment variable in Cloud Run / GKE.
spring.cloud.gcp.project-id=${GCP_PROJECT_ID:my-gcp-project}
