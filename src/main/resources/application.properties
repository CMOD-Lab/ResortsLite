# =============================================================================
# ResortsLite — Cloud-Native Configuration
# =============================================================================
# All environment-specific values are externalised to environment variables
# or AWS Systems Manager Parameter Store. Hard-coded credentials, URLs, and
# ports have been removed to comply with 12-factor app principles.
# =============================================================================

spring.application.name=ResortsLite

# -----------------------------------------------------------------------------
# Server port — injected by ECS / EKS / Elastic Beanstalk at runtime.
# Defaults to 8080 for local development. (Fixes cr-java-0077)
# -----------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# -----------------------------------------------------------------------------
# Database — credentials resolved from AWS Secrets Manager at startup.
# The BookingService.resolveDbCredentials() @PostConstruct method fetches
# host/user/password from the secret named by aws.secretsmanager.db-secret-name.
# (Fixes cr-java-0069)
# -----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------------
# AWS region — used by all AWS SDK v2 clients (S3, Secrets Manager, SSM).
# Override with the AWS_REGION environment variable in ECS task definitions.
# -----------------------------------------------------------------------------
cloud.aws.region.static=${AWS_REGION:us-east-1}

# -----------------------------------------------------------------------------
# AWS Secrets Manager — secret names for DB credentials and auth tokens.
# (Fixes cr-java-0069, cr-java-0090)
# -----------------------------------------------------------------------------
aws.secretsmanager.db-secret-name=${DB_SECRET_NAME:resortslite/db/credentials}
aws.secretsmanager.auth-secret-name=${AUTH_SECRET_NAME:resortslite/auth/credentials}

# -----------------------------------------------------------------------------
# Amazon S3 — bucket and key prefixes for report and backup storage.
# Replaces hard-coded local file paths /var/legacy/reports/ and C:\ResortBackups\.
# (Fixes cr-java-0061, cr-java-0062, cr-java-0063)
# -----------------------------------------------------------------------------
cloud.aws.s3.report-bucket=${S3_REPORT_BUCKET:resorts-lite-reports}
cloud.aws.s3.report-prefix=${S3_REPORT_PREFIX:reports/}
cloud.aws.s3.backup-prefix=${S3_BACKUP_PREFIX:backups/nightly/}

# -----------------------------------------------------------------------------
# AWS Systems Manager Parameter Store — parameter names for environment URLs.
# (Fixes cr-java-0071)
# -----------------------------------------------------------------------------
ssm.param.report-download-url=${SSM_REPORT_DOWNLOAD_URL_PARAM:/resortslite/report/download-url}

# -----------------------------------------------------------------------------
# Service endpoints — externalised from hard-coded values.
# Populated from AWS SSM Parameter Store or environment variables at runtime.
# (Fixes cr-java-0071)
# -----------------------------------------------------------------------------
app.payment.endpoint=${PAYMENT_API_ENDPOINT:http://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_SERVICE_URL:https://inventory-service.internal/rooms/available}
app.notification.endpoint=${NOTIFICATION_SERVICE_URL:https://notify.internal/send}

# -----------------------------------------------------------------------------
# Amazon ElastiCache for Redis — session and cache storage.
# Replaces HttpSession (cr-java-0065) and in-memory HashMap (cr-java-0067).
# -----------------------------------------------------------------------------
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# Cache and session TTL configuration
app.cache.booking-ttl-minutes=${BOOKING_CACHE_TTL_MINUTES:60}
app.session.ttl-minutes=${SESSION_TTL_MINUTES:30}
