# ResortsLite — Cloud-Native Configuration
# All environment-specific values are injected at runtime via environment variables
# (ECS task definition, Elastic Beanstalk environment, or AWS SSM Parameter Store).

spring.application.name=ResortsLite

# Server port — injected from environment variable set by ECS/EKS at runtime.
# Replaces the hard-coded server.port=8080 (blocker-12, cr-java-0077).
server.port=${SERVER_PORT:8080}

# ─── Database ────────────────────────────────────────────────────────────────
# Credentials are retrieved at runtime from AWS Secrets Manager (blocker-8/9, cr-java-0069).
# The secret name is configured via DB_SECRET_NAME environment variable.
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── AWS Secrets Manager ─────────────────────────────────────────────────────
# Secret name for database credentials (blocker-8/9, cr-java-0069)
DB_SECRET_NAME=${DB_SECRET_NAME:resortslite/db/credentials}
# Secret name for authentication credentials (blocker-18, cr-java-0090)
AUTH_SECRET_NAME=${AUTH_SECRET_NAME:resortslite/auth/credentials}

# ─── Amazon S3 — Report Storage ──────────────────────────────────────────────
# Replaces hard-coded /var/legacy/reports/ and C:\ResortBackups\nightly\ paths
# (blockers 1-7, cr-java-0061/0062/0063).
REPORT_S3_BUCKET=${REPORT_S3_BUCKET:resorts-lite-reports}
REPORT_S3_PREFIX=${REPORT_S3_PREFIX:reports/}

# ─── AWS SSM Parameter Store — Environment URLs ──────────────────────────────
# Parameter names for environment-specific URLs (blockers 10/11, cr-java-0071).
SSM_REPORT_DOWNLOAD_URL_PARAM=${SSM_REPORT_DOWNLOAD_URL_PARAM:/resortslite/report/download-base-url}

# Inventory service URL — injected from environment / SSM Parameter Store (blocker-10).
INVENTORY_SERVICE_URL=${INVENTORY_SERVICE_URL:https://inventory-service.internal/rooms/available}

# Payment API URL — injected from environment / SSM Parameter Store.
PAYMENT_API_URL=${PAYMENT_API_URL:https://payment-service.internal/payments/charge}

# ─── Spring Session — Amazon ElastiCache for Redis ───────────────────────────
# Replaces HttpSession-based state storage (blockers 13-17, cr-java-0065).
# Replaces in-memory HashMap cache without TTL (blocker-20, cr-java-0067).
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=spring:session

# Redis / ElastiCache connection — injected from environment variables.
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}

# Booking cache TTL in minutes (blocker-20, cr-java-0067)
BOOKING_CACHE_TTL_MINUTES=${BOOKING_CACHE_TTL_MINUTES:60}
