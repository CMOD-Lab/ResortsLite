# ResortsLite - Cloud-Native Configuration
spring.application.name=ResortsLite

# Blocker-12 (cr-java-0077): Port is now driven by the SERVER_PORT environment variable
# injected at runtime by ECS/EKS task definitions — no hard-coded port in application logic.
server.port=${SERVER_PORT:8080}

# Database — credentials are retrieved from AWS Secrets Manager at runtime (BookingService).
# The datasource URL may also be overridden via environment variable for cloud deployments.
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Blocker-8,9 (cr-java-0069): AWS Secrets Manager secret name for DB credentials.
cloud.aws.secretsmanager.db-secret-name=${DB_SECRET_NAME:resortslite/db/credentials}

# Blocker-1,2,3,4,5,6,7 (cr-java-0061, cr-java-0062, cr-java-0063):
# S3 bucket for report storage — replaces hard-coded /var/legacy/reports/ path.
cloud.aws.s3.report-bucket=${REPORT_S3_BUCKET:resorts-reports-bucket}

# AWS region for SDK clients
cloud.aws.region.static=${AWS_REGION:us-east-1}

# Blocker-10,11 (cr-java-0071): Service endpoints externalised — resolved from AWS SSM
# Parameter Store at runtime. These properties serve as local-dev fallback overrides.
app.inventory.endpoint=${INVENTORY_ENDPOINT:}
app.payment.endpoint=${PAYMENT_ENDPOINT:}
app.report.base-url=${REPORT_BASE_URL:}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:}

# Blocker-13,14,15,16,17 (cr-java-0065): Spring Session backed by Amazon ElastiCache for Redis.
# Replaces in-process HTTP session storage with distributed, centralized session management.
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session

# Blocker-20 (cr-java-0067): Redis connection for ElastiCache (session + cache).
# Host/port injected via environment variables set in ECS/EKS task definitions.
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.ssl=${REDIS_SSL:false}
