# ResortsLite - Cloud-Native Configuration
spring.application.name=ResortsLite

# Server port: read from environment variable; defaults to 8080 for local development.
# In ECS/EKS the PORT env var is injected at runtime — no hard-coded value in source.
server.port=${PORT:8080}

# -----------------------------------------------------------------------
# Database — credentials are fetched at startup from AWS Secrets Manager.
# The application reads the secret named by DB_SECRET_NAME and populates
# the datasource URL, username, and password programmatically.
# For local development, fall back to the in-memory H2 database.
# -----------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------
# AWS configuration
# -----------------------------------------------------------------------
# AWS region used by all SDK clients (S3, Secrets Manager, SSM)
aws.region=${AWS_REGION:us-east-1}

# S3 bucket that stores generated reports (replaces /var/legacy/reports/)
aws.s3.bucket-name=${S3_BUCKET_NAME:resortslite-reports}

# AWS Secrets Manager secret name that holds DB credentials JSON
aws.secretsmanager.db-secret-name=${DB_SECRET_NAME:resortslite/db/credentials}

# -----------------------------------------------------------------------
# Service endpoints — resolved from AWS SSM Parameter Store at runtime.
# The parameter names below are looked up via the SsmParameterStoreConfig bean.
# -----------------------------------------------------------------------
aws.ssm.param.payment-endpoint=${SSM_PAYMENT_PARAM:/resortslite/payment/endpoint}
aws.ssm.param.inventory-endpoint=${SSM_INVENTORY_PARAM:/resortslite/inventory/endpoint}
aws.ssm.param.notification-endpoint=${SSM_NOTIFICATION_PARAM:/resortslite/notification/endpoint}
aws.ssm.param.report-download-base-url=${SSM_REPORT_URL_PARAM:/resortslite/reports/download-base-url}

# -----------------------------------------------------------------------
# Spring Session — Amazon ElastiCache for Redis
# Replaces in-process HttpSession storage with a distributed Redis store so
# that any ECS/EKS instance can serve any request without sticky sessions.
# -----------------------------------------------------------------------
spring.session.store-type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
# TTL for session data (30 minutes)
spring.session.timeout=1800s
