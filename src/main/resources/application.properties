# ResortsLite - Cloud-Native Configuration
# All environment-specific values are externalised to environment variables
# or AWS Systems Manager Parameter Store. No hard-coded credentials or URLs.

spring.application.name=ResortsLite

# Server port is injected at runtime by ECS / Elastic Beanstalk via SERVER_PORT env var.
# Replaces the former hard-coded port 8080 (cr-java-0077).
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Database — credentials are managed by AWS Secrets Manager (cr-java-0069).
# The BookingService retrieves username/password from Secrets Manager at runtime.
# The secret name is controlled by the DB_SECRET_NAME environment variable.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# Spring Session — backed by Amazon ElastiCache for Redis (cr-java-0065).
# Enables stateless application instances with distributed session management.
# ---------------------------------------------------------------------------
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session

# ---------------------------------------------------------------------------
# Redis / ElastiCache connection (cr-java-0065, cr-java-0067).
# REDIS_HOST and REDIS_PORT are injected at runtime by ECS / Elastic Beanstalk.
# ---------------------------------------------------------------------------
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.ssl=${REDIS_SSL:false}

# ---------------------------------------------------------------------------
# AWS region — required by AWS SDK v2 clients (S3, Secrets Manager, SSM).
# ---------------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}

# ---------------------------------------------------------------------------
# Amazon S3 — bucket name for report storage (cr-java-0061, cr-java-0062, cr-java-0063).
# Replaces the former hard-coded /var/legacy/reports/ path.
# ---------------------------------------------------------------------------
report.s3.bucket=${REPORT_S3_BUCKET:resorts-reports-bucket}

# ---------------------------------------------------------------------------
# Service endpoints — externalised to environment variables (cr-java-0071).
# Values can also be sourced from AWS SSM Parameter Store at startup.
# ---------------------------------------------------------------------------
app.payment.endpoint=${PAYMENT_API_URL:https://payment-service.internal/payments/charge}
app.inventory.endpoint=${INVENTORY_SERVICE_URL:https://inventory-service.internal/rooms}
app.notification.endpoint=${NOTIFICATION_SERVICE_URL:https://notify.internal/send}

# ---------------------------------------------------------------------------
# AWS Secrets Manager — secret name for database credentials (cr-java-0069).
# ---------------------------------------------------------------------------
app.db.secret.name=${DB_SECRET_NAME:resortslite/db/credentials}
