# ResortsLite - Cloud-Ready Configuration (Azure)
# All sensitive values must be supplied via environment variables or Azure App Configuration.
# No hard-coded credentials, paths, ports, or URLs in this file.

spring.application.name=ResortsLite

# ─── Server Port ──────────────────────────────────────────────────────────────
# cr-java-0077: Port externalised to environment variable for dynamic assignment
# in Azure container orchestration platforms.
server.port=${SERVER_PORT:8080}

# ─── Datasource ───────────────────────────────────────────────────────────────
# cr-java-0069: No hard-coded credentials. Values supplied via environment variables
# or Azure Key Vault references at runtime.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── Azure Key Vault ──────────────────────────────────────────────────────────
# cr-java-0069: Azure Key Vault URI for retrieving secrets at runtime.
# Set AZURE_KEYVAULT_URI to your Key Vault endpoint, e.g.:
#   https://<your-vault-name>.vault.azure.net/
azure.keyvault.uri=${AZURE_KEYVAULT_URI:}

# ─── Azure Blob Storage ───────────────────────────────────────────────────────
# cr-java-0061 / cr-java-0062 / cr-java-0063: Replaces local file system paths.
# Set AZURE_STORAGE_BLOB_ENDPOINT to your storage account endpoint, e.g.:
#   https://<your-account>.blob.core.windows.net
azure.storage.blob.endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:}
azure.storage.blob.container-name=${AZURE_STORAGE_CONTAINER_NAME:reports}

# ─── Azure Cache for Redis ────────────────────────────────────────────────────
# cr-java-0065: Replaces in-memory HTTP session storage with Azure Cache for Redis.
spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6380}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.redis.ssl=${AZURE_REDIS_SSL:true}
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=spring:session

# ─── Azure Service Bus ────────────────────────────────────────────────────────
# cr-java-0111: Replaces java.util.Timer with Azure Service Bus scheduled messages.
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.queue-name=${AZURE_SERVICEBUS_QUEUE_NAME:report-schedule-queue}

# ─── Azure Active Directory (Entra ID) ───────────────────────────────────────
# cr-java-0090: Replaces file-based authentication with Azure AD / MSAL.
spring.cloud.azure.active-directory.enabled=${AAD_ENABLED:false}
spring.cloud.azure.active-directory.credential.client-id=${AAD_CLIENT_ID:}
spring.cloud.azure.active-directory.credential.client-secret=${AAD_CLIENT_SECRET:}
spring.cloud.azure.active-directory.profile.tenant-id=${AAD_TENANT_ID:}

# ─── Externalized Service Endpoints ──────────────────────────────────────────
# cr-java-0071: Hard-coded environment URLs replaced with configurable properties.
# Override via Azure App Configuration or environment variables.
app.db.host=${APP_DB_HOST:}
app.payment.endpoint=${APP_PAYMENT_ENDPOINT:https://payment-svc.internal/charge}
app.inventory.endpoint=${APP_INVENTORY_ENDPOINT:https://inventory-svc.internal/rooms}
app.notification.endpoint=${APP_NOTIFICATION_ENDPOINT:https://notify.internal/send}
app.report.download.base-url=${APP_REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download}
