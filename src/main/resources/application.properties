# ResortsLite — Cloud-Native Configuration
# All environment-specific values are externalised via environment variables
# or AWS Systems Manager Parameter Store (12-factor app principle).

spring.application.name=ResortsLite

# ─── Server Port ──────────────────────────────────────────────────────────────
# Port is injected at runtime by ECS / EKS / Elastic Beanstalk via the
# SERVER_PORT environment variable. No hard-coded port in source code.
server.port=${SERVER_PORT:8080}

# ─── Datasource ───────────────────────────────────────────────────────────────
# Credentials are retrieved from AWS Secrets Manager at runtime by BookingService.
# The datasource URL, username, and password below are used for local development
# with the H2 in-memory database only.
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── Amazon ElastiCache for Redis (Spring Session + Distributed Cache) ────────
# Replace local HTTP session storage and in-memory HashMap cache with
# Amazon ElastiCache for Redis. Host and port are injected via environment
# variables set by ECS task definitions or Elastic Beanstalk environment config.
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}

# Spring Session: store sessions in Redis so all instances share session state.
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=spring:session

# ─── AWS Configuration ────────────────────────────────────────────────────────
# AWS region is injected via the AWS_REGION environment variable.
# Credentials are provided by the IAM role attached to the ECS task / EC2 instance.
cloud.aws.region.static=${AWS_REGION:us-east-1}
cloud.aws.stack.auto=false

# ─── S3 Bucket for Reports ────────────────────────────────────────────────────
# Bucket name is injected via environment variable — no hard-coded path.
app.reports.s3-bucket=${REPORTS_S3_BUCKET:resorts-lite-reports}

# ─── SSM Parameter Store Keys ─────────────────────────────────────────────────
# Parameter names used to look up runtime configuration from AWS SSM.
app.ssm.server-port-param=${SSM_SERVER_PORT_PARAM:/resortslite/server/port}
app.ssm.payment-api-param=${SSM_PAYMENT_API_PARAM:/resortslite/payment/api-url}
app.ssm.inventory-url-param=${SSM_INVENTORY_URL_PARAM:/resortslite/inventory/service-url}
app.ssm.report-url-param=${SSM_REPORT_URL_PARAM:/resortslite/reports/download-url}
app.ssm.auth-service-param=${SSM_AUTH_SERVICE_PARAM:/resortslite/auth/service-url}

# ─── Secrets Manager ──────────────────────────────────────────────────────────
# Secret name for database credentials stored in AWS Secrets Manager.
app.secrets.db-secret-name=${DB_SECRET_NAME:resortslite/db/credentials}
