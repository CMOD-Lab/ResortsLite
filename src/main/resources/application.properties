# ResortsLite - Cloud-Native Configuration
# All environment-specific values are injected via environment variables or
# AWS Systems Manager Parameter Store / Secrets Manager at runtime.

spring.application.name=ResortsLite

# Server port — injected from environment variable for dynamic assignment by ECS/EKS
server.port=${SERVER_PORT:8080}

# ─── Datasource ───────────────────────────────────────────────────────────────
# Credentials are retrieved from AWS Secrets Manager at runtime (not stored here).
# The datasource URL uses an environment variable so it can be overridden per environment.
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── AWS Configuration ────────────────────────────────────────────────────────
# AWS region — injected from environment variable
cloud.aws.region=${AWS_REGION:us-east-1}

# S3 bucket for report storage (replaces hard-coded /var/legacy/reports/)
cloud.aws.s3.report-bucket=${S3_REPORT_BUCKET:resorts-reports-bucket}

# AWS Secrets Manager secret names
cloud.aws.secretsmanager.db-secret-name=${DB_SECRET_NAME:resorts/db/credentials}
cloud.aws.secretsmanager.payment-secret-name=${PAYMENT_SECRET_NAME:resorts/payment/api}

# AWS SSM Parameter Store parameter names for service URLs
cloud.aws.ssm.report-url-param=${REPORT_URL_SSM_PARAM:/resorts/report/download-url}
cloud.aws.ssm.inventory-url-param=${INVENTORY_URL_SSM_PARAM:/resorts/inventory/service-url}

# ─── Redis / ElastiCache (Spring Session + Cache) ─────────────────────────────
# Redis host — injected from environment variable pointing to ElastiCache endpoint
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}

# Spring Session backed by Redis (replaces in-memory HttpSession)
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resorts:session

# ─── Cache TTL ────────────────────────────────────────────────────────────────
# Booking cache TTL in seconds (default 30 minutes)
cache.booking.ttl-seconds=${BOOKING_CACHE_TTL:1800}
