# ResortsLite - Cloud-Native Configuration (Azure)
# All sensitive values must be supplied via environment variables or Azure Key Vault.
# Do NOT hard-code credentials, URLs, or ports in this file.

spring.application.name=ResortsLite

# -----------------------------------------------------------------------
# cr-java-0077 FIX: Server port externalised to environment variable.
# Set SERVER_PORT in your Azure App Service / Container Apps environment.
# -----------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# -----------------------------------------------------------------------
# Database — connection details externalised (no hard-coded credentials).
# cr-java-0069 FIX: Credentials retrieved from Azure Key Vault at runtime.
# -----------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------
# cr-java-0065 / cr-java-0067 FIX: Azure Cache for Redis — Spring Session.
# Set REDIS_HOST and REDIS_PORT in your Azure environment.
# -----------------------------------------------------------------------
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}

# Spring Session — store sessions in Redis (replaces HttpSession)
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=spring:session

# Booking cache TTL (minutes)
BOOKING_CACHE_TTL_MINUTES=${BOOKING_CACHE_TTL_MINUTES:60}
SESSION_TTL_MINUTES=${SESSION_TTL_MINUTES:30}

# -----------------------------------------------------------------------
# cr-java-0061 / cr-java-0062 / cr-java-0063 FIX: Azure Blob Storage.
# Set AZURE_STORAGE_CONNECTION_STRING or AZURE_STORAGE_ENDPOINT +
# Managed Identity in your Azure environment.
# -----------------------------------------------------------------------
AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:}
AZURE_BLOB_CONTAINER_NAME=${AZURE_BLOB_CONTAINER_NAME:resort-reports}
AZURE_BACKUP_CONTAINER_NAME=${AZURE_BACKUP_CONTAINER_NAME:resort-backups}
AZURE_STORAGE_ENDPOINT=${AZURE_STORAGE_ENDPOINT:}

# -----------------------------------------------------------------------
# cr-java-0069 FIX: Azure Key Vault URI for secret retrieval.
# Set AZURE_KEY_VAULT_URI in your Azure environment.
# -----------------------------------------------------------------------
AZURE_KEY_VAULT_URI=${AZURE_KEY_VAULT_URI:}

# -----------------------------------------------------------------------
# cr-java-0071 FIX: Azure App Configuration endpoint for externalised URLs.
# Set AZURE_APP_CONFIG_ENDPOINT in your Azure environment.
# -----------------------------------------------------------------------
AZURE_APP_CONFIG_ENDPOINT=${AZURE_APP_CONFIG_ENDPOINT:}

# -----------------------------------------------------------------------
# cr-java-0071 FIX: Service endpoint URLs — externalised from source code.
# Override via Azure App Configuration or environment variables.
# -----------------------------------------------------------------------
INVENTORY_SERVICE_URL=${INVENTORY_SERVICE_URL:https://inventory-service.internal:8081/rooms/available}
REPORT_DOWNLOAD_BASE_URL=${REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com}

# -----------------------------------------------------------------------
# cr-java-0111 FIX: Azure Service Bus for distributed scheduled tasks.
# Set AZURE_SERVICE_BUS_CONNECTION_STRING in your Azure environment.
# -----------------------------------------------------------------------
AZURE_SERVICE_BUS_CONNECTION_STRING=${AZURE_SERVICE_BUS_CONNECTION_STRING:}
AZURE_SERVICE_BUS_QUEUE_NAME=${AZURE_SERVICE_BUS_QUEUE_NAME:report-schedule-queue}

# -----------------------------------------------------------------------
# cr-java-0090 FIX: Azure Active Directory (Entra ID) authentication.
# Set these values in your Azure environment for AAD integration.
# -----------------------------------------------------------------------
azure.activedirectory.tenant-id=${AZURE_TENANT_ID:}
azure.activedirectory.client-id=${AZURE_CLIENT_ID:}
azure.activedirectory.client-secret=${AZURE_CLIENT_SECRET:}
azure.activedirectory.user-group.allowed-groups=${AZURE_AAD_ALLOWED_GROUPS:ResortAdmins}
