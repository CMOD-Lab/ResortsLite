# ResortsLite - Cloud-Native Configuration
# All environment-specific values are externalized via environment variables,
# AWS Systems Manager Parameter Store, or AWS Secrets Manager.

spring.application.name=ResortsLite

# Server port — injected at runtime by ECS task definition / EKS pod spec / Elastic Beanstalk.
# Defaults to 8080 if SERVER_PORT environment variable is not set.
server.port=${SERVER_PORT:8080}

# ─── Database ────────────────────────────────────────────────────────────────
# Datasource URL, username, and password are injected via environment variables.
# In production, these values are populated from AWS Secrets Manager by the
# deployment platform (ECS secrets, EKS external-secrets, or Beanstalk env config).
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ─── AWS Secrets Manager ─────────────────────────────────────────────────────
# Secret names for database and authentication credentials.
# Override via environment variables in each deployment environment.
DB_SECRET_NAME=${DB_SECRET_NAME:resortslite/db/credentials}
AUTH_SECRET_NAME=${AUTH_SECRET_NAME:resortslite/auth/credentials}

# ─── Amazon S3 ───────────────────────────────────────────────────────────────
# S3 bucket for report storage — replaces hard-coded /var/legacy/reports/ path.
REPORT_S3_BUCKET=${REPORT_S3_BUCKET:resorts-lite-reports}

# ─── Amazon ElastiCache for Redis (Spring Session) ───────────────────────────
# Redis host and port injected at runtime — no hard-coded endpoints.
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}

# Spring Session backed by Redis — enables stateless instances and horizontal scaling
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session

# ─── AWS SSM Parameter Store paths ───────────────────────────────────────────
# These SSM paths are resolved at runtime by the application.
# /resortslite/inventory/endpoint  → inventory service HTTPS URL
# /resortslite/report/base-url     → report download base HTTPS URL
# /resortslite/payment/api-url     → payment service HTTPS URL

# ─── Service Endpoints (fallback defaults) ───────────────────────────────────
# Used only when SSM Parameter Store is unavailable (e.g., local development).
app.payment.endpoint=${PAYMENT_API_URL:https://payment-service/payments/charge}
app.inventory.endpoint=${INVENTORY_API_URL:https://inventory-service/rooms}
app.notification.endpoint=${NOTIFICATION_API_URL:https://notification-service/send}
