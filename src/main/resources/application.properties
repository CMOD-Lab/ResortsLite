# ============================================================
# ResortsLite — Cloud-Ready Configuration (Azure)
# All sensitive values must be supplied via environment
# variables or Azure App Configuration at runtime.
# ============================================================

spring.application.name=ResortsLite

# cr-java-0077: Port externalized — override with PORT env var in Azure Container Apps / AKS.
server.port=${PORT:8080}

# ------------------------------------------------------------
# Datasource — credentials resolved at runtime via Azure Key Vault
# (cr-java-0069). The JDBC URL itself may also be injected via
# the DB_URL environment variable set in the deployment manifest.
# ------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=false

# ------------------------------------------------------------
# Azure Key Vault — cr-java-0069
# Set AZURE_KEYVAULT_URI in the deployment environment.
# DefaultAzureCredential picks up Managed Identity automatically.
# ------------------------------------------------------------
azure.keyvault.uri=${AZURE_KEYVAULT_URI:https://your-keyvault.vault.azure.net/}

# ------------------------------------------------------------
# Azure Blob Storage — cr-java-0061 / cr-java-0062 / cr-java-0063
# Set AZURE_STORAGE_BLOB_ENDPOINT in the deployment environment.
# ------------------------------------------------------------
azure.storage.blob.endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:https://yourstorageaccount.blob.core.windows.net}
azure.storage.blob.container-name=${AZURE_STORAGE_CONTAINER_NAME:reports}

# ------------------------------------------------------------
# Azure Service Bus — cr-java-0111 (replaces java.util.Timer)
# Set AZURE_SERVICEBUS_CONNECTION_STRING in the deployment environment.
# ------------------------------------------------------------
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.queue-name=${AZURE_SERVICEBUS_QUEUE_NAME:report-schedule-queue}

# ------------------------------------------------------------
# Azure Cache for Redis — cr-java-0065 / cr-java-0067
# Spring Session automatically uses Redis when spring-session-data-redis is on the classpath.
# Set REDIS_HOST and REDIS_PASSWORD in the deployment environment.
# ------------------------------------------------------------
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6380}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=true
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=resortslite:session

# ------------------------------------------------------------
# Externalized service endpoints — cr-java-0071
# Override via Azure App Configuration or environment variables.
# ------------------------------------------------------------
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal/send}
app.db.host=${DB_HOST:}

# cr-java-0071: Report download base URL — no hard-coded hostname.
app.report.download.base-url=${REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com}

# ------------------------------------------------------------
# Azure Active Directory — cr-java-0090
# Replaces file-based authentication with Azure AD / Entra ID.
# Set AZURE_AD_TENANT_ID and AZURE_AD_CLIENT_ID in the deployment environment.
# ------------------------------------------------------------
spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.credential.client-id=${AZURE_AD_CLIENT_ID:}
spring.cloud.azure.active-directory.profile.tenant-id=${AZURE_AD_TENANT_ID:}
