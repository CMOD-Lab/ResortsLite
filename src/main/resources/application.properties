# ResortsLite - Cloud-Ready Configuration (Azure)
# All hard-coded values have been externalised to environment variables or
# Azure App Configuration / Azure Key Vault per cloud-readiness remediation.

spring.application.name=ResortsLite

# ─── Server Port (cr-java-0077) ──────────────────────────────────────────────
# Port is now driven by the SERVER_PORT environment variable so that container
# orchestration platforms (Azure Container Apps / AKS) can assign ports dynamically.
server.port=${SERVER_PORT:8080}

# ─── Datasource (cr-java-0069) ───────────────────────────────────────────────
# Credentials are NOT stored here. At runtime they are resolved from Azure Key Vault
# via DefaultAzureCredential. The values below are safe defaults for local dev only.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── Azure Key Vault (cr-java-0069) ──────────────────────────────────────────
# URI of the Azure Key Vault instance that holds DB credentials and other secrets.
# Set AZURE_KEYVAULT_URI in the deployment environment (App Service / Container Apps).
azure.keyvault.uri=${AZURE_KEYVAULT_URI:}

# ─── Azure Blob Storage (cr-java-0061 / cr-java-0062 / cr-java-0063) ─────────
# Endpoint and container name for report storage — replaces /var/legacy/reports.
azure.storage.blob.endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:}
azure.storage.blob.container-name=${AZURE_STORAGE_CONTAINER_NAME:reports}

# ─── Azure Service Bus (cr-java-0111) ────────────────────────────────────────
# Connection string and queue name for distributed scheduled task delivery —
# replaces java.util.Timer.
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.queue-name=${AZURE_SERVICEBUS_QUEUE_NAME:report-scheduler}

# ─── Azure Cache for Redis (cr-java-0065 / cr-java-0067) ─────────────────────
# Redis host/port for Spring Session and distributed booking cache.
# Set REDIS_HOST and REDIS_PORT in the deployment environment.
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}

# Spring Session backed by Redis — replaces in-memory HttpSession (cr-java-0065)
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=spring:session

# ─── Azure Active Directory / Entra ID (cr-java-0090) ────────────────────────
# Tenant and client IDs for Azure AD authentication via Spring Security.
# Set these in the deployment environment; never hard-code credentials here.
azure.activedirectory.tenant-id=${AZURE_AD_TENANT_ID:}
azure.activedirectory.client-id=${AZURE_AD_CLIENT_ID:}
azure.activedirectory.client-secret=${AZURE_AD_CLIENT_SECRET:}

# ─── External Service Endpoints (cr-java-0071) ───────────────────────────────
# All internal service URLs are externalised — no hard-coded hostnames in source code.
app.payment.endpoint=${APP_PAYMENT_ENDPOINT:https://payment-svc.internal/payments/charge}
app.inventory.endpoint=${APP_INVENTORY_ENDPOINT:https://inventory-service.internal:8081/rooms/available}
app.notification.endpoint=${APP_NOTIFICATION_ENDPOINT:https://notify.internal/send}
app.report.download.base-url=${APP_REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com}

# ─── Database Host (cr-java-0069) ────────────────────────────────────────────
# DB host externalised — resolved from environment variable, not hard-coded.
app.db.host=${APP_DB_HOST:}
