# ResortsLite - Cloud-Native Configuration (GCP)
spring.application.name=ResortsLite

# -----------------------------------------------------------------------
# Server port — read from environment variable; defaults to 8080 locally.
# Cloud Run / GKE inject PORT at runtime (blocker-12: cr-java-0077).
# -----------------------------------------------------------------------
server.port=${PORT:8080}

# -----------------------------------------------------------------------
# Database — credentials externalised to Google Secret Manager
# (blockers 8-9: cr-java-0069).
# Set GCP_PROJECT_ID, DB_URL, DB_USERNAME, DB_PASSWORD as env vars or
# mount them via Secret Manager references at deployment time.
# -----------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${sm://projects/${GCP_PROJECT_ID:my-gcp-project}/secrets/db-username/versions/latest:sa}
spring.datasource.password=${sm://projects/${GCP_PROJECT_ID:my-gcp-project}/secrets/db-password/versions/latest:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------
# Service endpoints — externalised via environment variables
# (blockers 10-11: cr-java-0071).
# -----------------------------------------------------------------------
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal/send}
app.report.download.base-url=${REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download}

# -----------------------------------------------------------------------
# Google Cloud Storage — replaces local file system (blockers 1-7)
# -----------------------------------------------------------------------
gcs.bucket.name=${GCS_BUCKET_NAME:resorts-lite-reports}
gcs.report.prefix=${GCS_REPORT_PREFIX:reports/}

# -----------------------------------------------------------------------
# Spring Session — backed by Google Cloud Memorystore for Redis
# (blockers 13-17, 20: cr-java-0065, cr-java-0067)
# -----------------------------------------------------------------------
spring.session.store-type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=resortslite:session

# -----------------------------------------------------------------------
# GCP project — used by Secret Manager and GCS clients
# -----------------------------------------------------------------------
spring.cloud.gcp.project-id=${GCP_PROJECT_ID:my-gcp-project}
