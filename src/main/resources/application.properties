# ResortsLite - Cloud-Native Configuration
# All environment-specific values are injected via environment variables or
# AWS Systems Manager Parameter Store. No hard-coded credentials or endpoints.

spring.application.name=ResortsLite

# ─── Server Port ──────────────────────────────────────────────────────────────
# Injected from environment variable SERVER_PORT; defaults to 8080.
# Replaces hard-coded port (cr-java-0077 / czr-port-001).
server.port=${SERVER_PORT:8080}

# ─── DataSource ───────────────────────────────────────────────────────────────
# Connection URL, username, and password are injected from environment variables.
# Credentials are stored in AWS Secrets Manager (secret: resortslite/db/credentials).
# Replaces hard-coded DB credentials (cr-java-0069).
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── AWS Secrets Manager ──────────────────────────────────────────────────────
# Secret names for database and authentication credentials (cr-java-0069, cr-java-0090).
aws.secretsmanager.db-secret-name=${DB_SECRET_NAME:resortslite/db/credentials}
aws.secretsmanager.auth-secret-name=${AUTH_SECRET_NAME:resortslite/auth/credentials}

# ─── AWS SSM Parameter Store ──────────────────────────────────────────────────
# Parameter names for environment-specific URLs (cr-java-0071).
ssm.parameter.report-download-url=${SSM_REPORT_DOWNLOAD_URL_PARAM:/resortslite/report/download-url-base}

# ─── Amazon S3 (Report Storage) ───────────────────────────────────────────────
# Replaces hard-coded local file paths /var/legacy/reports/ and C:\ResortBackups\nightly\
# (cr-java-0061, cr-java-0062, cr-java-0063).
cloud.aws.s3.report-bucket=${REPORT_S3_BUCKET:resorts-lite-reports}
cloud.aws.s3.report-prefix=${REPORT_S3_PREFIX:reports/}

# ─── Service Endpoints (externalized) ─────────────────────────────────────────
# Replaces hard-coded internal service URLs (cr-java-0071).
app.payment.endpoint=${PAYMENT_API_URL:https://payment-svc.internal/payments/charge}
app.inventory.endpoint=${INVENTORY_SERVICE_URL:https://inventory-service.internal/rooms/available}
app.notification.endpoint=${NOTIFICATION_SERVICE_URL:https://notify.internal/send}

# ─── Amazon ElastiCache for Redis (Spring Session + Cache) ────────────────────
# Replaces in-memory HTTP session storage and unbounded HashMap cache
# (cr-java-0065, cr-java-0067).
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}

# Spring Session: store sessions in Redis (ElastiCache) for distributed, stateless instances
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:session
spring.session.timeout=1800

# Spring Cache: use Redis as the cache provider
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000

# Booking cache TTL in minutes (used by BookingController Redis cache)
cache.booking.ttl-minutes=${BOOKING_CACHE_TTL_MINUTES:60}
