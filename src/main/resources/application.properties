# ResortsLite - Cloud-Native Configuration for Azure
# All sensitive values are read from environment variables or Azure App Configuration at runtime.
spring.application.name=ResortsLite

# ─────────────────────────────────────────────────────────────────────────────
# Server Port — Blocker-12 (cr-java-0077)
# Reads PORT env var first (set by Azure Container Apps / App Service), falls back to 8080.
# ─────────────────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ─────────────────────────────────────────────────────────────────────────────
# Database — credentials are NOT hard-coded; they are injected via environment variables
# which are populated from Azure Key Vault references in Azure App Service / Container Apps.
# ─────────────────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─────────────────────────────────────────────────────────────────────────────
# Azure Key Vault — Blocker-8/9 (cr-java-0069)
# URI is injected from environment variable; DefaultAzureCredential handles auth.
# ─────────────────────────────────────────────────────────────────────────────
azure.keyvault.uri=${AZURE_KEYVAULT_URI:https://your-keyvault.vault.azure.net/}

# ─────────────────────────────────────────────────────────────────────────────
# Azure Blob Storage — Blockers 1-7 (cr-java-0061/0062/0063)
# Replaces all local file system paths (/var/legacy/reports, C:\ResortBackups).
# ─────────────────────────────────────────────────────────────────────────────
azure.storage.blob.endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:https://your-storage.blob.core.windows.net}
azure.storage.blob.container-name=${AZURE_STORAGE_CONTAINER_NAME:reports}

# ─────────────────────────────────────────────────────────────────────────────
# Azure Service Bus — Blocker-19 (cr-java-0111)
# Replaces java.util.Timer with distributed scheduled message delivery.
# ─────────────────────────────────────────────────────────────────────────────
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.queue-name=${AZURE_SERVICEBUS_QUEUE_NAME:report-schedule-queue}

# ─────────────────────────────────────────────────────────────────────────────
# Azure Cache for Redis — Blockers 13-17, 20 (cr-java-0065/0067)
# Replaces in-memory HttpSession and static HashMap cache.
# SSL is enforced for Azure Cache for Redis (port 6380).
# ─────────────────────────────────────────────────────────────────────────────
spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6380}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.redis.ssl=${AZURE_REDIS_SSL:true}

# ─────────────────────────────────────────────────────────────────────────────
# Externalized Service Endpoints — Blockers 10/11 (cr-java-0071)
# All environment-specific URLs are loaded from environment variables /
# Azure App Configuration — no hard-coded hostnames or ports in source code.
# ─────────────────────────────────────────────────────────────────────────────
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal/send}
app.report.download.base-url=${REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com}

# ─────────────────────────────────────────────────────────────────────────────
# Azure Active Directory (Entra ID) — Blocker-18 (cr-java-0090)
# Replaces file-based authentication with Azure AD OAuth2 / MSAL.
# ─────────────────────────────────────────────────────────────────────────────
spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.profile.tenant-id=${AZURE_TENANT_ID:your-tenant-id}
spring.cloud.azure.active-directory.credential.client-id=${AZURE_CLIENT_ID:your-client-id}
spring.cloud.azure.active-directory.credential.client-secret=${AZURE_CLIENT_SECRET:}
