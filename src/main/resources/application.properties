# ResortsLite - PostgreSQL 16 Configuration
spring.application.name=ResortsLite

# Server port — externalised to environment variable for container/cloud compatibility
# (czr-port-001: dynamic port assignment for ECS/EKS; falls back to 8080 if not set)
server.port=${SERVER_PORT:8080}

# ─── PostgreSQL 16 DataSource ────────────────────────────────────────────────
# DB_MIGRATION: Replaced H2 in-memory datasource with PostgreSQL 16 JDBC connection.
# All connection parameters are externalised to environment variables so that
# credentials are never stored in source code or version control.
# (cr-java-0021: no hardcoded hostnames/credentials; use AWS Parameter Store / Secrets Manager)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resortdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── HikariCP Connection Pool ────────────────────────────────────────────────
# Tuned for PostgreSQL 16; values can be overridden via environment variables.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.connection-test-query=SELECT 1

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
# PostgreSQL dialect — Hibernate 6 (bundled with Spring Boot 3.2.x) auto-detects
# the dialect; explicit setting is provided for clarity.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Validate schema on startup; use 'none' in production with Flyway/Liquibase
spring.jpa.hibernate.ddl-auto=update
# Log SQL in development; set to false in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ─── External Service Endpoints ──────────────────────────────────────────────
# (cr-java-0021 / cr-java-0088: externalised to env vars; HTTPS enforced)
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal:7070/send}

# ─── Report Storage ──────────────────────────────────────────────────────────
# (czr-java-001: no hardcoded absolute paths; use env var or cloud object storage)
app.report.base-path=${REPORT_BASE_PATH:/tmp/reports/}
app.report.download-base-url=${REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download/}
