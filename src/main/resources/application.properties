# ResortsLite - Cloud-Native Configuration
# All environment-specific values are injected via environment variables at runtime.
# Set these variables in your ECS task definition, Elastic Beanstalk environment,
# or local .env file for development.

spring.application.name=ResortsLite

# ─── Server Port ──────────────────────────────────────────────────────────────
# Port is read from the SERVER_PORT environment variable injected by ECS/EKS/Beanstalk.
# Container orchestrators override this value dynamically; the default is for local dev only.
server.port=${SERVER_PORT:8080}

# ─── Database ─────────────────────────────────────────────────────────────────
# Credentials are retrieved from AWS Secrets Manager at runtime (see BookingService).
# The datasource URL below uses H2 in-memory for local development.
# In production, override spring.datasource.url via environment variable or
# inject the full JDBC URL from Secrets Manager.
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── AWS Configuration ────────────────────────────────────────────────────────
# AWS region for SDK clients (S3, Secrets Manager, SSM Parameter Store).
# Override with the AWS_REGION environment variable in cloud deployments.
aws.region=${AWS_REGION:us-east-1}

# Name of the Secrets Manager secret holding DB credentials { host, username, password }.
# Set DB_SECRET_NAME in the ECS task definition / Beanstalk environment.
app.db.secret-name=${DB_SECRET_NAME:resorts/db/credentials}

# Name of the Secrets Manager secret holding auth credentials.
app.auth.secret-name=${AUTH_SECRET_NAME:resorts/auth/credentials}

# S3 bucket for report storage (replaces hard-coded /var/legacy/reports/ path).
app.report.s3-bucket=${REPORT_S3_BUCKET:resorts-reports-bucket}

# ─── Spring Session / Amazon ElastiCache for Redis ────────────────────────────
# Spring Session stores HTTP session data in Redis so all instances share session state.
# Set REDIS_HOST and REDIS_PORT to your ElastiCache cluster endpoint.
spring.session.store-type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resorts:session

# ─── Service Endpoints (externalised — do NOT hard-code URLs here) ────────────
# These are provided as defaults for local development only.
# In cloud environments, set the corresponding environment variables or use
# AWS Systems Manager Parameter Store (see BookingController / ReportService).
app.payment.endpoint=${PAYMENT_API_URL:https://payment-svc.internal/payments/charge}
app.inventory.endpoint=${INVENTORY_API_URL:https://inventory-svc.internal/rooms}
app.notification.endpoint=${NOTIFICATION_API_URL:https://notify.internal/send}
