# ResortsLite — Cloud-Ready Configuration
# All environment-specific values are externalized here and can be overridden
# via environment variables (ECS task definition) or AWS SSM Parameter Store.

spring.application.name=ResortsLite

# Server port — injected from environment variable SERVER_PORT at runtime.
# In AWS ECS/EKS the container port is set dynamically via task definition.
# Fixes blocker-12 (cr-java-0077): hard-coded port replaced with env-var injection.
server.port=${SERVER_PORT:8080}

# ─── Database ────────────────────────────────────────────────────────────────
# Datasource URL — override via environment variable SPRING_DATASOURCE_URL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
# Credentials are NOT stored here — they are retrieved from AWS Secrets Manager
# at runtime by BookingService. The secret name is configured below.
# Fixes blockers 8, 9 (cr-java-0069): hard-coded DB_USER / DB_PASS removed.
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── AWS ─────────────────────────────────────────────────────────────────────
# AWS region — override via environment variable AWS_REGION.
aws.region=${AWS_REGION:us-east-1}

# AWS Secrets Manager secret name for DB credentials.
# Fixes blockers 8, 9 (cr-java-0069) and blocker-18 (cr-java-0090).
# Set DB_SECRET_NAME in ECS task definition environment.
db.secret.name=${DB_SECRET_NAME:resortslite/db/credentials}

# ─── Amazon S3 (Report Storage) ──────────────────────────────────────────────
# S3 bucket and prefix for report storage.
# Fixes blockers 1-7 (cr-java-0061, cr-java-0062, cr-java-0063).
# Set REPORT_S3_BUCKET in ECS task definition environment.
report.s3.bucket=${REPORT_S3_BUCKET:resortslite-reports}
report.s3.prefix=${REPORT_S3_PREFIX:reports/}

# ─── Service Endpoints (externalized — no hard-coded URLs) ───────────────────
# Fixes blocker-10 (cr-java-0071): inventory service URL externalized.
# Populate via AWS SSM Parameter Store and inject as env var in ECS task definition.
app.inventory.service.url=${INVENTORY_SERVICE_URL:http://inventory-service.internal:8081}

# Fixes blocker-11 (cr-java-0071): payment endpoint externalized.
app.payment.endpoint=${PAYMENT_ENDPOINT:http://payment-svc.internal:9090/charge}

# Report download base URL (used as fallback; S3 pre-signed URLs are preferred).
report.download.base.url=${REPORT_DOWNLOAD_BASE_URL:}

# ─── Spring Session — Amazon ElastiCache for Redis ───────────────────────────
# Fixes blockers 13-17 (cr-java-0065): HTTP session state migrated to Redis.
# Spring Session transparently stores HttpSession in Redis, enabling stateless
# application instances and horizontal scaling without server affinity.
spring.session.store-type=redis
spring.session.timeout=1800

# Redis / ElastiCache connection — override via environment variables.
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}

# ─── Spring Cache — Amazon ElastiCache for Redis ─────────────────────────────
# Fixes blocker-20 (cr-java-0067): in-memory HashMap cache replaced with Redis cache.
# TTL is set to 600 seconds (10 minutes) to prevent stale data and unbounded growth.
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false
