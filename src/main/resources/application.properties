# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0069 fix: AWS Secrets Manager secret name for DB credentials.
# The secret must be a JSON object with keys: username, password, host (optional).
# Override via DB_SECRET_NAME environment variable at runtime.
db.secret.name=${DB_SECRET_NAME:resortslite/db/credentials}

# cr-java-0061 fix: Amazon S3 configuration replaces hard-coded file paths
# Override via environment variables AWS_REPORTS_BUCKET and AWS_REGION at runtime
aws.reports.bucket=${AWS_REPORTS_BUCKET:resort-reports-bucket}
aws.region=${AWS_REGION:us-east-1}

# cr-java-0077 fix: Hard-coded port replaced with environment-variable injection.
# SERVER_PORT is populated at runtime from AWS Systems Manager Parameter Store
# (e.g. parameter /resortslite/server/port) via ECS task definition environment properties,
# EKS pod env vars, or Elastic Beanstalk environment configuration.
# This enables dynamic port assignment by the container orchestration platform.
server.port=${SERVER_PORT:8080}

# cr-java-0065 fix: Amazon ElastiCache for Redis — Spring Session distributed store.
# ELASTICACHE_REDIS_HOST and ELASTICACHE_REDIS_PORT are injected at runtime via ECS
# task-definition environment variables, EKS pod env vars, or Elastic Beanstalk
# environment configuration pointing at the ElastiCache cluster endpoint.
# Session TTL (spring.session.timeout) defaults to 30 minutes; override as needed.
spring.redis.host=${ELASTICACHE_REDIS_HOST:localhost}
spring.redis.port=${ELASTICACHE_REDIS_PORT:6379}
spring.redis.ssl=${ELASTICACHE_REDIS_SSL:false}
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:session
spring.session.timeout=1800

# cr-java-0067 fix: Amazon ElastiCache for Redis — booking cache TTL configuration.
# Replaces the unbounded static HashMap (bookingCache) that caused indefinite memory
# growth and stale-data inconsistencies across EC2 instances.  Each booking entry is
# stored in the shared ElastiCache cluster with a TTL so Redis automatically evicts
# stale entries, ensuring controlled expiration and consistent data across all instances.
# Override BOOKING_CACHE_TTL_MINUTES via ECS task-definition env vars, EKS pod env vars,
# or Elastic Beanstalk environment configuration.
cache.booking.ttl-minutes=${BOOKING_CACHE_TTL_MINUTES:30}
spring.cache.type=redis

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send
