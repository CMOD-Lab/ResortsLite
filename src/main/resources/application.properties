# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0077 REMEDIATION: Hard-coded port 8080 replaced with environment variable SERVER_PORT.
# Set SERVER_PORT as an environment variable (or Azure App Service application setting) to allow
# dynamic port assignment by Azure container orchestration platforms (Azure Container Apps / AKS).
# Falls back to 8080 for local development when SERVER_PORT is not set.
# Configure in Azure App Service: Settings > Configuration > Application settings > SERVER_PORT
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# Azure Blob Storage configuration (cr-java-0061 remediation).
# Set AZURE_STORAGE_CONNECTION_STRING and AZURE_STORAGE_REPORTS_CONTAINER as environment
# variables (or Azure App Service application settings) to avoid hard-coded file paths.
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.reports-container=${AZURE_STORAGE_REPORTS_CONTAINER:resort-reports}

# cr-java-0069 REMEDIATION: Azure Key Vault URI for database credential retrieval.
# Set AZURE_KEYVAULT_URI as an environment variable (or Azure App Service application setting).
# Example: https://<your-vault-name>.vault.azure.net/
# The application uses DefaultAzureCredential to authenticate:
#   - In Azure: via Managed Identity (no secrets needed in config)
#   - Locally: via AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID env vars or Azure CLI login
azure.keyvault.uri=${AZURE_KEYVAULT_URI:}

# cr-java-0071 REMEDIATION: Externalized environment-specific service URLs.
# Replace hard-coded URLs with values from Azure App Configuration or environment variables.
# Set APP_INVENTORY_URL in Azure App Service application settings or Azure App Configuration
# to point to the correct inventory service endpoint per environment (dev/staging/prod).
app.inventory.url=${APP_INVENTORY_URL:http://inventory-service.internal:8081/rooms/available}

# cr-java-0071 REMEDIATION: Externalized report download base URL.
# Replace hard-coded "http://reports.resorts-internal.com:8080/download/" with a value
# loaded from Azure App Configuration or the APP_REPORTS_BASE_URL environment variable.
# Configure per environment in Azure App Service application settings.
app.reports.base-url=${APP_REPORTS_BASE_URL:https://reports.resorts-internal.com/download/}

# cr-java-0065 REMEDIATION: Azure Cache for Redis — externalized session state storage.

# cr-java-0111 REMEDIATION: Azure Service Bus — distributed, timezone-agnostic scheduled task delivery.
# Replaces java.util.Timer / server-local scheduling with Azure Service Bus scheduled messages.
# All scheduled enqueue times are expressed in UTC (OffsetDateTime.now(ZoneOffset.UTC)) so
# scheduling is consistent across all container instances and cloud regions regardless of
# the host OS timezone setting.
#
# Required Azure App Service application settings:
#   AZURE_SERVICE_BUS_CONNECTION_STRING — Azure Service Bus namespace connection string.
#     Found in Azure Portal > Service Bus Namespace > Shared access policies > RootManageSharedAccessKey.
#   AZURE_SERVICE_BUS_REPORT_QUEUE     — Name of the Service Bus queue used for report scheduling tasks.
#     Create the queue in Azure Portal > Service Bus Namespace > Queues > + Queue.
#     Recommended settings: Enable duplicate detection, set message TTL to 24h.
azure.servicebus.connection-string=${AZURE_SERVICE_BUS_CONNECTION_STRING:}
azure.servicebus.report-queue=${AZURE_SERVICE_BUS_REPORT_QUEUE:resort-report-queue}

# cr-java-0065 REMEDIATION: Azure Cache for Redis — externalized session state storage.
# Replace in-memory HttpSession with Redis-backed Spring Session to enable stateless
# horizontal scaling across multiple application instances.
#
# Required Azure App Service application settings:
#   SPRING_REDIS_HOST   — Azure Cache for Redis hostname
#                         (e.g., <cache-name>.redis.cache.windows.net)
#   SPRING_REDIS_PORT   — Redis port (6380 for TLS, 6379 for non-TLS; default: 6380)
#   SPRING_REDIS_PASSWORD — Azure Cache for Redis primary/secondary access key
#   SPRING_REDIS_SSL    — true for Azure Cache for Redis (TLS required by default)
#
# Spring Session will automatically use Redis as the session store when
# spring-session-data-redis is on the classpath and @EnableRedisHttpSession is active.
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6380}
spring.redis.password=${SPRING_REDIS_PASSWORD:}
spring.redis.ssl=${SPRING_REDIS_SSL:true}
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session

# cr-java-0067 REMEDIATION: Azure Cache for Redis — distributed booking cache with TTL.
# Replaces the removed static in-memory HashMap (bookingCache) with a Redis-backed cache
# that is shared across all application instances and expires entries automatically.
# This prevents unbounded memory growth, stale data inconsistencies, and instance-local
# state that breaks horizontal scaling in cloud environments.
#
# Required / optional Azure App Service application settings:
#   BOOKING_CACHE_TTL_MINUTES — TTL (in minutes) for individual booking cache entries.
#     Default: 60 minutes. Increase for read-heavy workloads; decrease for freshness.
app.booking.cache.ttl-minutes=${BOOKING_CACHE_TTL_MINUTES:60}

# cr-java-0090 REMEDIATION: Azure Active Directory (Entra ID) JWT authentication.
# Replaces file-based credential storage with centralised Azure AD identity management.
#
# Required Azure App Service application settings:
#   AZURE_AD_TENANT_ID  — Azure AD tenant ID (GUID) for your organisation.
#                         Found in Azure Portal > Azure Active Directory > Overview.
#   AZURE_AD_CLIENT_ID  — Application (client) ID of the Azure AD App Registration
#                         that represents this resource server.
#                         Found in Azure Portal > App Registrations > <your-app> > Overview.
#
# Spring Security OAuth2 Resource Server uses the issuer-uri to discover the Azure AD
# JWKS endpoint and validate incoming Bearer JWT tokens automatically.
# No credentials or user data are stored locally — all identity management is delegated
# to Azure Active Directory, enabling horizontal scalability and Zero Trust compliance.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${AZURE_AD_TENANT_ID:your-tenant-id}/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=${AZURE_AD_CLIENT_ID:your-client-id}

# Azure AD App Registration client ID (used for audience validation of incoming tokens)
azure.activedirectory.client-id=${AZURE_AD_CLIENT_ID:your-client-id}
azure.activedirectory.tenant-id=${AZURE_AD_TENANT_ID:your-tenant-id}
