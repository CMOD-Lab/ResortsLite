# ResortsLite - Cloud-Ready Configuration
# All environment-specific values are now externalised via environment variables
# or AWS SSM Parameter Store / Secrets Manager.

spring.application.name=ResortsLite

# Server port is now driven by the SERVER_PORT environment variable (cr-java-0077).
# ECS / EKS injects this at runtime; defaults to 8080 for local development.
server.port=${SERVER_PORT:8080}

# ─── Database ────────────────────────────────────────────────────────────────
# Credentials are retrieved from AWS Secrets Manager at application startup
# (cr-java-0069). The secret name is supplied via DB_SECRET_NAME env var.
# For local development the H2 in-memory database is used as a fallback.
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── AWS Secrets Manager ─────────────────────────────────────────────────────
# Name of the Secrets Manager secret that holds DB credentials (cr-java-0069).
app.db.secret-name=${DB_SECRET_NAME:resorts/db/credentials}

# ─── Amazon S3 (replaces local file system) ──────────────────────────────────
# S3 bucket used for report storage (cr-java-0061, cr-java-0062, cr-java-0063).
app.report.s3-bucket=${REPORT_S3_BUCKET:resorts-reports-bucket}

# ─── AWS SSM Parameter Store keys ────────────────────────────────────────────
# These parameters must be created in SSM Parameter Store per environment (cr-java-0071).
# /resorts/report/download-url   — base URL for report downloads
# /resorts/inventory/endpoint    — inventory service endpoint
# /resorts/report/base-url       — S3 base URL for report files

# ─── Amazon ElastiCache for Redis (Spring Session) ───────────────────────────
# Replaces in-process HTTP session storage (cr-java-0065) and in-memory cache (cr-java-0067).
# REDIS_HOST and REDIS_PORT are injected by ECS task definition / EKS config map.
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.session.store-type=redis
# Session TTL: 30 minutes (controls cache expiry — fixes cr-java-0067 unbounded growth).
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resorts:session

# ─── Service endpoints (cr-java-0071) ────────────────────────────────────────
# These are now read from environment variables; SSM Parameter Store is the
# authoritative source and values are injected at container startup.
app.payment.endpoint=${PAYMENT_API_URL:https://payment-service.internal/payments/charge}
app.inventory.endpoint=${INVENTORY_API_URL:https://inventory-service.internal/rooms}
app.notification.endpoint=${NOTIFICATION_API_URL:https://notify-service.internal/send}
