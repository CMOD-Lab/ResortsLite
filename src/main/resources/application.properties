# ResortsLite - Application Configuration
# Updated: Application name retained for service discovery.
spring.application.name=ResortsLite

# Updated: Server port externalised via environment variable to support dynamic port
# assignment by ECS/EKS container orchestration (fixes czr-port-001).
server.port=${SERVER_PORT:8080}

# Updated: PostgreSQL datasource configuration replacing H2 in-memory database.
# Connection parameters externalised to environment variables / AWS Parameter Store
# to avoid hardcoded infrastructure values (fixes cr-java-0021).
# Format: jdbc:postgresql://<host>:<port>/<database>
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resortdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Updated: Connection pool settings for PostgreSQL using HikariCP (Spring Boot default).
# Pool sizing externalised for environment-specific tuning.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

# Updated: JPA/Hibernate dialect set explicitly for PostgreSQL 16.
# DDL auto set to 'validate' for production safety; use 'create-drop' only in dev/test.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Updated: H2 console disabled — not applicable for PostgreSQL.
# spring.h2.console.enabled=false (removed H2-specific config)

# Updated: Internal service endpoints externalised to environment variables.
# Hardcoded non-routable hostnames replaced (fixes cr-java-0021).
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal/send}

# Updated: Report storage path externalised to environment variable.
# Replaces hardcoded /var/legacy/reports path (fixes czr-java-001).
app.report.base-path=${REPORT_BASE_PATH:/tmp/reports/}
