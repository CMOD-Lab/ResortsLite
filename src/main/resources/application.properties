# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0077 remediation: Server port externalised to environment variable SERVER_PORT.
# Azure App Service / Container Apps sets SERVER_PORT dynamically; the default 8080 is used
# only for local development.  Override by setting the SERVER_PORT environment variable or
# adding SERVER_PORT to Azure App Configuration / App Service application settings.
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0071 remediation: Externalized inventory availability endpoint URL.
# Override APP_INVENTORY_AVAILABILITY_ENDPOINT via Azure App Configuration or environment
# variable to point to the correct environment-specific service URL without code changes.
app.inventory.availability-endpoint=${APP_INVENTORY_AVAILABILITY_ENDPOINT:${app.inventory.endpoint}/available}

# Azure Blob Storage configuration (cr-java-0061 remediation).
# Replace hard-coded absolute file paths with Azure Blob Storage.
# Set AZURE_STORAGE_CONNECTION_STRING as an environment variable or Azure App Service setting
# to avoid committing credentials to source control.
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=https;AccountName=<your-account>;AccountKey=<your-key>;EndpointSuffix=core.windows.net}
azure.storage.reports-container=${AZURE_STORAGE_REPORTS_CONTAINER:resort-reports}
azure.storage.backup-container=${AZURE_STORAGE_BACKUP_CONTAINER:resort-backups}

# cr-java-0069 remediation: Azure Key Vault URI for secure credential retrieval.
# Set AZURE_KEYVAULT_URI as an environment variable or Azure App Service application setting.
# The Key Vault must contain secrets named "db-username" and "db-password".
# Authentication is handled automatically via DefaultAzureCredential (Managed Identity,
# environment variables, Azure CLI, etc.) — no credentials are stored in source code.
azure.keyvault.uri=${AZURE_KEYVAULT_URI:https://<your-keyvault-name>.vault.azure.net/}

# cr-java-0065 remediation: Azure Cache for Redis configuration.
# HTTP session state is now stored in Redis instead of in-memory HttpSession objects,
# enabling stateless architecture and horizontal scaling across multiple instances.
# Set AZURE_REDIS_HOST, AZURE_REDIS_PORT, and AZURE_REDIS_PASSWORD as environment
# variables or Azure App Service application settings.  Azure Cache for Redis uses
# SSL on port 6380 by default; set AZURE_REDIS_SSL=true for production deployments.
spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6379}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.redis.ssl=${AZURE_REDIS_SSL:false}

# Spring Session: use Redis as the session store (replaces in-memory HttpSession).
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortsLite:session
spring.session.timeout=30m

# =============================================================================
# cr-java-0090 remediation: Azure Active Directory (Entra ID) Authentication
# =============================================================================
# Replaces file-based credential storage with Azure AD OAuth2 / OIDC identity
# management using MSAL and Spring Security Azure AD integration.
#
# Set the following as environment variables or Azure App Service application
# settings — NEVER store actual values in source-controlled files:
#
#   AZURE_AD_TENANT_ID      — Azure AD tenant (directory) ID
#   AZURE_AD_CLIENT_ID      — Application (client) ID registered in Azure AD
#   AZURE_AD_CLIENT_SECRET  — Client secret (prefer Managed Identity instead)
#   AZURE_AD_APP_ID_URI     — Application ID URI (OAuth2 audience claim)
#
# Spring Cloud Azure Active Directory starter reads these properties to configure
# the MSAL-backed JWT decoder that validates bearer tokens issued by Azure AD.
# No credentials are stored in local files; authentication is fully delegated to
# Azure Active Directory (Entra ID) for centralized, scalable identity management.
spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.credential.tenant-id=${AZURE_AD_TENANT_ID:}
spring.cloud.azure.active-directory.credential.client-id=${AZURE_AD_CLIENT_ID:}
spring.cloud.azure.active-directory.credential.client-secret=${AZURE_AD_CLIENT_SECRET:}
spring.cloud.azure.active-directory.app-id-uri=${AZURE_AD_APP_ID_URI:}
# Resource server profile: validates incoming JWT bearer tokens from Azure AD.
spring.cloud.azure.active-directory.profile.tenant-id=${AZURE_AD_TENANT_ID:}
spring.cloud.azure.active-directory.application-type=resource-server

# =============================================================================
# cr-java-0111 remediation: Azure Service Bus — Distributed Scheduled Messaging
# =============================================================================
# Replaces java.util.Timer / server-local scheduling with Azure Service Bus
# scheduled message delivery for distributed, timezone-agnostic task execution.
#
# Set the following as environment variables or Azure App Service application
# settings — NEVER store actual connection strings in source-controlled files:
#
#   AZURE_SERVICEBUS_CONNECTION_STRING — Primary connection string for the
#       Azure Service Bus namespace (found in Azure Portal → Service Bus →
#       Shared Access Policies).
#   AZURE_SERVICEBUS_REPORT_QUEUE     — Name of the queue used for report
#       generation tasks (default: resort-report-queue).
#
# All scheduled messages are enqueued with an explicit UTC OffsetDateTime so
# that scheduling is timezone-agnostic and consistent across cloud regions.
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.report-queue=${AZURE_SERVICEBUS_REPORT_QUEUE:resort-report-queue}
