# ResortsLite - Cloud-Native Configuration
# All environment-specific values are injected via environment variables or
# resolved at runtime from AWS Secrets Manager / SSM Parameter Store.

spring.application.name=ResortsLite

# FIX cr-java-0077: Server port resolved from SERVER_PORT environment variable.
# ECS / EKS / Elastic Beanstalk inject SERVER_PORT dynamically at container startup.
server.port=${SERVER_PORT:8080}

# Database — credentials are resolved from AWS Secrets Manager at startup (BookingService).
# The datasource URL may also be overridden via environment variable for cloud deployments.
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# FIX cr-java-0065 / cr-java-0067: Spring Session backed by Amazon ElastiCache for Redis.
# SPRING_REDIS_HOST and SPRING_REDIS_PORT are injected by ECS task definition / EKS ConfigMap.
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.password=${SPRING_REDIS_PASSWORD:}
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session

# FIX cr-java-0071: Service endpoint URLs externalized to environment variables.
# In production these are populated from AWS SSM Parameter Store via ECS secrets injection.
app.payment.endpoint=${PAYMENT_API_URL:https://payment-svc.internal/charge}
app.inventory.endpoint=${INVENTORY_API_URL:https://inventory-svc.internal/rooms}
app.notification.endpoint=${NOTIFICATION_API_URL:https://notify.internal/send}

# AWS configuration — region and resource names injected via environment variables.
aws.region=${AWS_REGION:us-east-1}
aws.secrets.db-secret-name=${DB_SECRET_NAME:resortslite/db/credentials}
aws.s3.reports-bucket=${REPORTS_S3_BUCKET:resortslite-reports}
aws.s3.reports-prefix=${REPORTS_S3_PREFIX:monthly-reports/}
aws.ssm.payment-api-param=${PAYMENT_API_PARAM:/resortslite/payment/api-url}
aws.ssm.inventory-url-param=${INVENTORY_URL_PARAM:/resortslite/inventory/api-url}
aws.ssm.report-download-url-param=${REPORT_DOWNLOAD_URL_PARAM:/resortslite/reports/download-base-url}
