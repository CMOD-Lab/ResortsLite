# ResortsLite - Cloud-Native Configuration
# All environment-specific values are externalised to environment variables,
# AWS Systems Manager Parameter Store, or AWS Secrets Manager.

spring.application.name=ResortsLite

# -----------------------------------------------------------------------
# Server port — injected at runtime by ECS / EKS via SERVER_PORT env var.
# Replaces the hard-coded server.port=8080 (cr-java-0077).
# -----------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# -----------------------------------------------------------------------
# DataSource — credentials retrieved from AWS Secrets Manager at runtime.
# The DB_SECRET_NAME env var points to the Secrets Manager secret that
# contains "username" and "password" fields (cr-java-0069).
# DB_HOST is injected via environment variable (not hard-coded).
# -----------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------
# Spring Session — Amazon ElastiCache for Redis (cr-java-0065).
# Replaces in-process HttpSession with a distributed Redis-backed store
# so all application instances share session state.
# -----------------------------------------------------------------------
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=spring:session

# -----------------------------------------------------------------------
# Redis / ElastiCache connection — injected via environment variables.
# REDIS_HOST and REDIS_PORT are set by ECS task definition or EKS config.
# -----------------------------------------------------------------------
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}

# -----------------------------------------------------------------------
# AWS region — required by AWS SDK v2 clients (S3, SSM, Secrets Manager).
# -----------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}

# -----------------------------------------------------------------------
# S3 bucket for report storage (cr-java-0061, cr-java-0062, cr-java-0063).
# Replaces hard-coded /var/legacy/reports/ and C:\ResortBackups\nightly\.
# -----------------------------------------------------------------------
reports.s3.bucket=${REPORTS_S3_BUCKET:resorts-reports-bucket}

# -----------------------------------------------------------------------
# AWS Secrets Manager secret names (cr-java-0069, cr-java-0090).
# -----------------------------------------------------------------------
aws.secrets.db=${DB_SECRET_NAME:resorts/db/credentials}
aws.secrets.auth=${AUTH_SECRET_NAME:resorts/auth/credentials}

# -----------------------------------------------------------------------
# AWS SSM Parameter Store parameter names (cr-java-0071).
# -----------------------------------------------------------------------
aws.ssm.inventory-url-param=${INVENTORY_URL_PARAM:/resorts/inventory/available-url}
aws.ssm.report-download-url-param=${REPORT_DOWNLOAD_URL_PARAM:/resorts/report/download-base-url}

# -----------------------------------------------------------------------
# Internal service endpoints — resolved from SSM Parameter Store at
# runtime; these properties serve as fallback defaults only (cr-java-0071).
# -----------------------------------------------------------------------
app.payment.endpoint=${PAYMENT_API_URL:https://payment-service/payments/charge}
app.inventory.endpoint=${INVENTORY_SERVICE_URL:https://inventory-service/rooms/available}
app.notification.endpoint=${NOTIFICATION_SERVICE_URL:https://notification-service/send}
