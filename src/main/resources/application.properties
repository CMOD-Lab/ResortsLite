# ResortsLite - PostgreSQL Configuration
# Migrated from H2 in-memory database to PostgreSQL 16
spring.application.name=ResortsLite

# Server port — read from environment variable for cloud/container compatibility
# Falls back to 8080 for local development
server.port=${SERVER_PORT:8080}

# ============================================================
# PostgreSQL 16 DataSource Configuration
# Connection parameters are externalised to environment
# variables / AWS Parameter Store / Secrets Manager.
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resortdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# Connection Pool (HikariCP — Spring Boot default)
# Tuned for PostgreSQL 16 production workloads
# ============================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# ============================================================
# JPA / Hibernate — PostgreSQL dialect
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ============================================================
# External service endpoints — externalised to environment
# variables for cloud/container portability
# ============================================================
app.payment.endpoint=${PAYMENT_ENDPOINT:http://payment-svc:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:http://inventory-svc:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:http://notify-svc:7070/send}

# ============================================================
# Report storage — externalised for container compatibility
# Override with S3 bucket path or mounted volume in production
# ============================================================
app.report.base-path=${REPORT_BASE_PATH:/tmp/reports/}
