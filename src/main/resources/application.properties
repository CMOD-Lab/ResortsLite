spring.application.name=ResortsLite

server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.payment.api.url=${PAYMENT_API_URL:https://payment-svc.internal/charge}
app.inventory.url=${INVENTORY_URL:https://inventory-svc.internal/rooms}
app.notification.endpoint=${NOTIFICATION_URL:https://notify.internal/send}
app.report.download-base-url=${REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal/download/}
app.server.port=${SERVER_PORT:8080}
app.reports.backup-prefix=${REPORTS_BACKUP_PREFIX:nightly/}

azure.keyvault.url=${AZURE_KEYVAULT_URL:}
azure.storage.blob.endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:}
azure.storage.blob.container-name=${AZURE_STORAGE_BLOB_CONTAINER:reports}
azure.servicebus.fully-qualified-namespace=${AZURE_SERVICEBUS_NAMESPACE:}
azure.servicebus.queue-name=${AZURE_SERVICEBUS_QUEUE:report-jobs}

spring.cloud.azure.appconfiguration.stores[0].connection-string=${AZURE_APP_CONFIGURATION_CONNECTION_STRING:}
spring.cloud.azure.active-directory.enabled=${AZURE_AD_ENABLED:false}
spring.cloud.azure.active-directory.profile.tenant-id=${AZURE_TENANT_ID:}
spring.cloud.azure.active-directory.credential.client-id=${AZURE_CLIENT_ID:}

spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6379}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:session
spring.session.redis.flush-mode=on_save
