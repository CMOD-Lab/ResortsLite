# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# -----------------------------------------------------------------------
# AWS S3 configuration — replaces hard-coded file paths (cr-java-0061 fix)
# Override these values via environment variables in your cloud deployment:
#   CLOUD_AWS_REGION, CLOUD_AWS_S3_BUCKET_NAME, CLOUD_AWS_S3_BACKUP_PREFIX
# -----------------------------------------------------------------------
cloud.aws.region=${CLOUD_AWS_REGION:us-east-1}
cloud.aws.s3.bucket-name=${CLOUD_AWS_S3_BUCKET_NAME:resorts-reports-bucket}
cloud.aws.s3.backup-prefix=${CLOUD_AWS_S3_BACKUP_PREFIX:backups/nightly/}

# -----------------------------------------------------------------------
# cr-java-0077 fix: Externalized server port via environment variable injection.
# The canonical port value is stored in AWS Systems Manager Parameter Store
# under /resortslite/server/port and injected at runtime through the SERVER_PORT
# environment variable in ECS task definitions, EKS pod specs, or Elastic
# Beanstalk environment properties. This enables dynamic port assignment required
# by container orchestration platforms and cloud service discovery mechanisms.
# To override: set the SERVER_PORT environment variable in your deployment config.
# -----------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# -----------------------------------------------------------------------
# AWS Secrets Manager — database credentials (cr-java-0069 fix)
# Set APP_DB_SECRET_NAME to the name/ARN of the Secrets Manager secret that
# holds a JSON object with "username" and "password" keys.
# -----------------------------------------------------------------------
app.db.secret-name=${APP_DB_SECRET_NAME:resortslite/db/credentials}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# -----------------------------------------------------------------------
# cr-java-0065 fix: Amazon ElastiCache for Redis — distributed session storage.
# Replaces HttpSession (instance-local) with a shared Redis store so that all
# EC2 instances behind the AWS ALB can read and write the same session data,
# enabling true horizontal scaling, zero-downtime auto-scaling, and failover.
#
# In production, set the following environment variables to point at your
# ElastiCache Redis cluster endpoint:
#   SPRING_REDIS_HOST  — ElastiCache primary endpoint (e.g. my-cluster.abc123.ng.0001.use1.cache.amazonaws.com)
#   SPRING_REDIS_PORT  — Redis port (default 6379)
#   SPRING_REDIS_PASSWORD — Redis AUTH token (if in-transit encryption / AUTH is enabled)
#
# Spring Session store type is set to 'redis' so that Spring Session
# automatically backs the HttpSession abstraction with Redis, and
# RedisTemplate<String, Object> is auto-configured for direct key/value access.
# -----------------------------------------------------------------------
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.password=${SPRING_REDIS_PASSWORD:}

# Spring Session — use Redis as the session store (cr-java-0065 fix)
spring.session.store-type=redis
# Session timeout — 30 minutes (aligns with SESSION_TTL_MINUTES in BookingController)
spring.session.timeout=30m
# Redis namespace for Spring Session keys
spring.session.redis.namespace=spring:session:resortslite
