# ResortsLite - Cloud-Native Configuration
# All environment-specific values are injected via environment variables or
# AWS Systems Manager Parameter Store. No hard-coded credentials or endpoints.

spring.application.name=ResortsLite

# -----------------------------------------------------------------------
# Server Port — injected from environment variable (replaces hard-coded 8080)
# ECS/EKS task definitions or Elastic Beanstalk set the PORT env variable.
# -----------------------------------------------------------------------
server.port=${PORT:8080}

# -----------------------------------------------------------------------
# DataSource — credentials resolved from AWS Secrets Manager at startup.
# The BookingService @PostConstruct loads DB_HOST/DB_USER from Secrets Manager.
# The JDBC URL, username, and password are injected via environment variables
# set by the deployment platform (ECS task definition / EB environment).
# -----------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------
# Amazon S3 — report storage bucket (replaces local file system paths)
# -----------------------------------------------------------------------
cloud.aws.s3.report-bucket=${S3_REPORT_BUCKET:resorts-reports-bucket}
cloud.aws.region.static=${AWS_REGION:us-east-1}

# -----------------------------------------------------------------------
# AWS Secrets Manager — secret names for credentials
# -----------------------------------------------------------------------
aws.secretsmanager.db-secret-name=${DB_SECRET_NAME:resortslite/db/credentials}
aws.secretsmanager.auth-secret-name=${AUTH_SECRET_NAME:resortslite/auth/credentials}

# -----------------------------------------------------------------------
# AWS Systems Manager Parameter Store — parameter paths for URLs and ports
# -----------------------------------------------------------------------
aws.ssm.report-download-url-param=${SSM_REPORT_URL_PARAM:/resortslite/report/download-url}
aws.ssm.server-port-param=${SSM_SERVER_PORT_PARAM:/resortslite/server/port}
aws.ssm.inventory-url-param=${SSM_INVENTORY_URL_PARAM:/resortslite/inventory/endpoint}

# -----------------------------------------------------------------------
# Service Endpoints — injected from environment variables.
# Replaces hard-coded internal hostnames (cr-java-0021 / cr-java-0071).
# -----------------------------------------------------------------------
app.payment.endpoint=${PAYMENT_API_ENDPOINT:https://payment-svc.internal/payments/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal/send}

# -----------------------------------------------------------------------
# Spring Session — Amazon ElastiCache for Redis
# Replaces in-memory HTTP session storage (cr-java-0065) and unbounded
# in-memory cache (cr-java-0067) with distributed Redis-backed session store.
# -----------------------------------------------------------------------
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session

# Redis / ElastiCache connection — injected from environment variables
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}

# Report download URL override (optional — SSM Parameter Store is preferred)
app.report.download-url=${REPORT_DOWNLOAD_URL:}
