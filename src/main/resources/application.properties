# ResortsLite - Cloud-Native Configuration
# All environment-specific values are externalised to environment variables,
# AWS SSM Parameter Store, or AWS Secrets Manager. No hard-coded credentials
# or infrastructure hostnames remain in this file.

spring.application.name=ResortsLite

# Server port: resolved from SERVER_PORT environment variable (injected by ECS/EKS/Beanstalk).
# Blocker-12: Hard-coded port 8080 replaced with environment variable injection.
server.port=${SERVER_PORT:8080}

# ─── Database ────────────────────────────────────────────────────────────────
# Blocker-8/9: Hard-coded DB credentials removed. Connection details are
# retrieved from AWS Secrets Manager at runtime (secret: resortslite/db/credentials).
# For local development the H2 in-memory database is used as a safe default.
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── AWS ─────────────────────────────────────────────────────────────────────
# AWS region — resolved from the standard AWS_REGION environment variable.
aws.region=${AWS_REGION:us-east-1}

# S3 bucket for report storage (replaces local /var/legacy/reports/ path).
# Blocker-1/2/3/4/5/6/7: No absolute file paths; all report I/O goes to S3.
cloud.aws.s3.bucket-name=${S3_BUCKET_NAME:resorts-lite-reports}

# Secrets Manager secret names — set via environment variables in ECS/EKS task definitions.
# Blocker-8/9: DB credentials secret name.
aws.secretsmanager.db-secret-name=${RESORTSLITE_DB_SECRET_NAME:resortslite/db/credentials}
# Blocker-18: Auth credentials secret name.
aws.secretsmanager.auth-secret-name=${RESORTSLITE_AUTH_SECRET_NAME:resortslite/auth/credentials}

# ─── Spring Session / Redis (ElastiCache) ────────────────────────────────────
# Blocker-13/14/15/16/17: HTTP session state migrated to Amazon ElastiCache for Redis
# via Spring Session, enabling stateless instances and horizontal scaling.
spring.session.store-type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session

# ─── Service Endpoints (SSM Parameter Store) ─────────────────────────────────
# Blocker-10/11: Hard-coded internal service URLs replaced with environment variables
# that are populated from AWS SSM Parameter Store at deployment time.
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal/payments/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-service.internal:8081/rooms/available}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal/send}
app.report.download-base-url=${REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download}
