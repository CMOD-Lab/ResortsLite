# ResortsLite - Application Configuration
spring.application.name=ResortsLite

# Server port externalised via environment variable for dynamic assignment by ECS/EKS
# (czr-port-001 fix: removed hardcoded port 8080)
server.port=${SERVER_PORT:8080}

# PostgreSQL datasource configuration
# Connection parameters externalised to environment variables / AWS Parameter Store / Secrets Manager
# (cr-java-0021 fix: replaced hardcoded H2 in-memory DB URL, username, and password)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resortdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# PostgreSQL connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# H2 console disabled — not applicable for PostgreSQL
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# External service endpoints externalised to environment variables
# (cr-java-0021 fix: replaced hardcoded internal hostnames non-routable in cloud VPC)
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal:7070/send}

# Report storage path externalised to environment variable
# (czr-java-001 fix: replaced hardcoded /var/legacy/reports absolute path)
app.report.base-path=${REPORT_BASE_PATH:/tmp/reports/}
