# ResortsLite - Cloud-Native Configuration (AWS)
# All environment-specific values are externalized per 12-factor app principles.

spring.application.name=ResortsLite

# Blocker-12 (cr-java-0077): Server port resolved from environment variable SERVER_PORT.
# Container orchestration (ECS/EKS) injects the port at runtime; no hard-coded value.
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Database — credentials resolved from AWS Secrets Manager at runtime
# (Blocker-8,9 cr-java-0069). The JDBC URL uses environment variable injection
# so no credentials appear in source code or container images.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# AWS Configuration
# ---------------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}

# Blocker-8,9 (cr-java-0069): Secret name in AWS Secrets Manager for DB credentials
aws.secretsmanager.db-secret-name=${DB_SECRET_NAME:resortslite/db/credentials}

# Blocker-18 (cr-java-0090): Secret name in AWS Secrets Manager for auth credentials
aws.secretsmanager.auth-secret-name=${AUTH_SECRET_NAME:resortslite/auth/credentials}

# Blocker-1,2,3,4,5,6,7 (cr-java-0061, cr-java-0062, cr-java-0063):
# S3 bucket for report storage — replaces all local file system paths
cloud.aws.s3.reports-bucket=${REPORTS_S3_BUCKET:resorts-lite-reports}

# ---------------------------------------------------------------------------
# AWS SSM Parameter Store — parameter names for externalized URLs
# (Blocker-10,11 cr-java-0071)
# ---------------------------------------------------------------------------
ssm.parameter.inventory-url=${SSM_INVENTORY_URL_PARAM:/resortslite/inventory/endpoint}
ssm.parameter.report-download-url=${SSM_REPORT_URL_PARAM:/resortslite/report/download-url}

# ---------------------------------------------------------------------------
# Service endpoints — resolved from environment variables at runtime
# (Blocker-10,11 cr-java-0071): No hard-coded environment-specific URLs
# ---------------------------------------------------------------------------
app.payment.endpoint=${PAYMENT_API_URL:https://payment-service.internal/payments/charge}
app.inventory.endpoint=${INVENTORY_SERVICE_URL:https://inventory-service.internal/rooms}
app.notification.endpoint=${NOTIFICATION_SERVICE_URL:https://notify.internal/send}

# ---------------------------------------------------------------------------
# Spring Session with Amazon ElastiCache for Redis
# (Blocker-13,14,15,16,17 cr-java-0065 & Blocker-20 cr-java-0067):
# Distributed session management — replaces in-memory HttpSession and HashMap cache.
# ---------------------------------------------------------------------------
spring.session.store-type=redis
spring.session.timeout=3600

spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}
