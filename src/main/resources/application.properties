# ResortsLite - Cloud-Native Configuration
# All environment-specific values are injected via environment variables.
# Hard-coded credentials, hostnames, and ports have been removed.

spring.application.name=ResortsLite

# cr-java-0077 FIX: Server port sourced from environment variable (SERVER_PORT).
# ECS/EKS/Elastic Beanstalk injects the port dynamically at runtime.
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Database Configuration
# cr-java-0069 FIX: Hard-coded DB credentials removed.
# Credentials are retrieved from AWS Secrets Manager at runtime.
# The JDBC URL, username, and password are injected via environment variables
# (e.g., set by ECS task definition secrets referencing Secrets Manager ARNs).
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# Amazon ElastiCache for Redis — Spring Session
# cr-java-0065 FIX: HTTP session state stored in Redis (distributed, shared).
# cr-java-0067 FIX: In-memory cache replaced with Redis-backed cache with TTL.
# ---------------------------------------------------------------------------
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session

# ---------------------------------------------------------------------------
# AWS S3 — Report Storage
# cr-java-0061 / cr-java-0062 / cr-java-0063 FIX:
# Hard-coded file paths replaced with S3 bucket configuration.
# ---------------------------------------------------------------------------
cloud.aws.s3.reports-bucket=${S3_REPORTS_BUCKET:resorts-lite-reports}
cloud.aws.region.static=${AWS_REGION:us-east-1}

# ---------------------------------------------------------------------------
# AWS Secrets Manager — Database Credentials
# cr-java-0069 / cr-java-0090 FIX:
# Secret name for DB credentials and authentication secrets.
# ---------------------------------------------------------------------------
cloud.aws.secrets.db-secret-name=${DB_SECRET_NAME:resortslite/db/credentials}

# ---------------------------------------------------------------------------
# Amazon Cognito — User Identity Management
# cr-java-0090 FIX: File-based authentication replaced with Amazon Cognito.
# ---------------------------------------------------------------------------
cloud.aws.cognito.user-pool-id=${COGNITO_USER_POOL_ID:}
cloud.aws.cognito.client-id=${COGNITO_CLIENT_ID:}

# ---------------------------------------------------------------------------
# Service Endpoints — AWS Systems Manager Parameter Store
# cr-java-0071 FIX: Hard-coded environment URLs replaced with environment
# variable injection (values sourced from SSM Parameter Store at deploy time).
# cr-java-0077 FIX: Hard-coded ports replaced with environment variables.
# ---------------------------------------------------------------------------
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-service.internal/payments/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-service.internal/rooms/available}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify-service.internal/send}
app.report.download.base-url=${REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download/}
