# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0077 FIX: Port is now injected at runtime via the SERVER_PORT environment variable.
# ECS task definitions, EKS pod specs, and Elastic Beanstalk environment properties set
# SERVER_PORT dynamically, enabling conflict-free port assignment and service discovery.
# The value can also be stored in AWS Systems Manager Parameter Store under
# /resortslite/server/port and injected as an environment variable at deploy time.
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0069 FIX: AWS Secrets Manager configuration for DB credentials.
# The secret named below must be a JSON object: {"username":"...","password":"..."}
# Override via environment variable AWS_SECRETSMANAGER_DB_CREDENTIALS_SECRET_NAME
# or set aws.secretsmanager.db-credentials-secret-name in your environment-specific config.
aws.secretsmanager.db-credentials-secret-name=${AWS_SECRETSMANAGER_DB_CREDENTIALS_SECRET_NAME:resortslite/db/credentials}

# AWS region used by the Secrets Manager client. Override via AWS_REGION env var.
aws.region=${AWS_REGION:us-east-1}

# cr-java-0071 FIX: AWS Systems Manager Parameter Store parameter names for environment-specific URLs.
# These replace all hard-coded environment URLs in BookingController and ReportService.
# Override each via the corresponding environment variable to point to a different SSM path
# per deployment environment (dev / staging / production) without code changes.
#
# SSM parameter: /resortslite/inventory/service-url
#   Value example: https://inventory-service.internal:8081/rooms/available
aws.ssm.inventory-service-url-param=${INVENTORY_SERVICE_URL_PARAM:/resortslite/inventory/service-url}
#
# SSM parameter: /resortslite/reports/download-base-url
#   Value example: https://reports.resorts-internal.com/download/
aws.ssm.report-download-base-url-param=${REPORT_DOWNLOAD_BASE_URL_PARAM:/resortslite/reports/download-base-url}
#
# cr-java-0077 FIX: SSM parameter for server port — allows ECS/EKS/Elastic Beanstalk to
# store and inject the port value via AWS Systems Manager Parameter Store at deploy time.
# SSM parameter: /resortslite/server/port
#   Value example: 8080
aws.ssm.server-port-param=${SERVER_PORT_PARAM:/resortslite/server/port}

# =============================================================================
# cr-java-0065 FIX: Amazon ElastiCache for Redis — Spring Session configuration
# =============================================================================
# All HTTP session state is now stored in Amazon ElastiCache for Redis via
# Spring Session, making application instances fully stateless.  Set these
# properties via environment variables in your ECS task definition, EKS pod
# spec, or Elastic Beanstalk environment configuration.
#
# SPRING_REDIS_HOST — ElastiCache primary endpoint hostname
#   Example: my-cluster.abc123.ng.0001.use1.cache.amazonaws.com
spring.redis.host=${SPRING_REDIS_HOST:localhost}
#
# SPRING_REDIS_PORT — ElastiCache port (default 6379)
spring.redis.port=${SPRING_REDIS_PORT:6379}
#
# Session TTL in seconds (default 1800 = 30 minutes).
# Override via SESSION_TIMEOUT environment variable.
spring.session.timeout=${SESSION_TIMEOUT:1800}
#
# Store type — explicitly set to redis so Spring Session auto-configuration
# selects the Redis-backed SessionRepository bean.
spring.session.store-type=redis

# =============================================================================
# cr-java-0067 FIX: Amazon ElastiCache for Redis — Booking cache TTL configuration
# =============================================================================
# TTL (time-to-live) in seconds for booking cache entries stored in ElastiCache.
# Entries are automatically evicted after this period, preventing unbounded memory
# growth and ensuring stale data does not persist across instances.
# Default: 3600 seconds (1 hour). Override via BOOKING_CACHE_TTL_SECONDS env var.
booking.cache.ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:3600}
#
# Redis key serializer — use StringRedisSerializer for keys and
# GenericJackson2JsonRedisSerializer for values to ensure human-readable keys
# and JSON-serialised booking objects in ElastiCache.
spring.redis.serializer.key=string
spring.redis.serializer.value=json
