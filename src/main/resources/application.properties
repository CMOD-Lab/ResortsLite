# ResortsLite — Application Configuration
# Java 21 / Spring Boot 3.2.x / PostgreSQL 16 compatible

spring.application.name=ResortsLite

# Server port — override via SERVER_PORT env var for ECS/EKS dynamic port assignment
server.port=${SERVER_PORT:8080}

# ============================================================
# Database — PostgreSQL 16 (migrated from MySQL/H2)
# Migration: MySQL connector replaced with PostgreSQL JDBC driver.
# Connection string format: jdbc:postgresql://<host>:<port>/<database>
# For production, supply DB_URL, DB_USER, DB_PASS via AWS Parameter Store /
# Secrets Manager and set spring.datasource.* accordingly.
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resortdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# PostgreSQL connection pool settings (HikariCP — Spring Boot default)
# ============================================================
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}
spring.datasource.hikari.connection-test-query=SELECT 1

# ============================================================
# PostgreSQL schema initialisation
# spring.sql.init.platform=postgresql ensures PostgreSQL-specific
# schema scripts (schema-postgresql.sql) are picked up automatically.
# ============================================================
spring.sql.init.platform=postgresql
spring.sql.init.mode=always

# ============================================================
# Internal service endpoints
# Fix: Plain HTTP URLs replaced with HTTPS; values resolved from env vars
# so they can be overridden per environment without code changes.
# ============================================================
app.payment.endpoint=${PAYMENT_API:https://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_SERVICE_URL:https://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_SERVICE_URL:https://notify.internal:7070/send}

# ============================================================
# Report configuration
# Fix: Hardcoded absolute file paths replaced with env-var-driven values.
# ============================================================
app.report.base-path=${REPORT_BASE_PATH:/var/reports/}
app.report.backup-path=${BACKUP_PATH:/var/backups/}
app.report.host=${REPORT_HOST:reports.resorts-internal.com}
