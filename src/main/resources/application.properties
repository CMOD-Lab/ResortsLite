# ResortsLite — Cloud-Native Configuration (GCP)
# All sensitive values are resolved from GCP Secret Manager at runtime.
# Non-sensitive defaults are provided here; override via environment variables in Cloud Run / GKE.

spring.application.name=ResortsLite

# ── Server ────────────────────────────────────────────────────────────────────
# Port is externalized — Cloud Run injects PORT env var; GKE uses service discovery.
# Hard-coded port removed (fixes cr-java-0077).
server.port=${PORT:8080}

# ── Datasource ────────────────────────────────────────────────────────────────
# Credentials are resolved from GCP Secret Manager (fixes cr-java-0069).
# In production set:
#   spring.datasource.url=${sm://db-url}
#   spring.datasource.username=${sm://db-username}
#   spring.datasource.password=${sm://db-password}
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── GCP Secret Manager (Spring Cloud GCP) ─────────────────────────────────────
# Enables ${sm://secret-name} placeholder resolution (fixes cr-java-0069, cr-java-0090).
spring.cloud.gcp.secretmanager.enabled=true

# ── Google Cloud Storage ───────────────────────────────────────────────────────
# Bucket names for report storage — replaces hard-coded local file paths
# (fixes cr-java-0061, cr-java-0062, cr-java-0063).
gcs.reports.bucket=${GCS_REPORTS_BUCKET:resorts-reports-bucket}
gcs.backup.bucket=${GCS_BACKUP_BUCKET:resorts-backup-bucket}

# ── Redis / Memorystore ────────────────────────────────────────────────────────
# Spring Session backed by Google Cloud Memorystore for Redis (fixes cr-java-0065, cr-java-0067).
spring.session.store-type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=resortslite:session

# Cache TTL for booking entries (minutes).
booking.cache.ttl.minutes=${BOOKING_CACHE_TTL_MINUTES:60}

# ── Internal Service Endpoints ─────────────────────────────────────────────────
# Hard-coded URLs replaced with externalized properties (fixes cr-java-0071).
# Sensitive endpoints can be stored in GCP Secret Manager:
#   app.payment.endpoint=${sm://payment-endpoint}
app.payment.endpoint=${PAYMENT_API_URL:https://payment-svc.internal/charge}
app.inventory.url=${INVENTORY_SERVICE_URL:https://inventory-service.internal:8081/rooms/available}
app.notification.endpoint=${NOTIFICATION_URL:https://notify.internal/send}
app.reports.base.url=${REPORTS_BASE_URL:https://reports.resorts-internal.com}

# ── Database credential properties (resolved from Secret Manager in production) ──
db.host=${DB_HOST:localhost}
db.user=${DB_USER:sa}
db.password=${DB_PASSWORD:}
payment.api.url=${PAYMENT_API_URL:https://payment-svc.internal/payments/charge}
