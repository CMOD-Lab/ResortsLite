# ResortsLite - Cloud-Ready Configuration
# All hard-coded infrastructure values have been externalized per 12-factor app principles.
spring.application.name=ResortsLite

# cr-java-0077 FIX: Server port now reads from SERVER_PORT environment variable.
# Container orchestration (ECS/EKS) injects the port dynamically at runtime.
server.port=${SERVER_PORT:8080}

# Database configuration — credentials are retrieved from AWS Secrets Manager at runtime.
# The JDBC URL host/port should be injected via environment variables in cloud deployments.
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# cr-java-0069 FIX: AWS Secrets Manager secret names for database and auth credentials.
# These names are environment-specific and injected via environment variables.
cloud.aws.secretsmanager.db-secret-name=${DB_SECRET_NAME:resortslite/db/credentials}
cloud.aws.secretsmanager.auth-secret-name=${AUTH_SECRET_NAME:resortslite/auth/credentials}

# cr-java-0061 / cr-java-0062 / cr-java-0063 FIX:
# Amazon S3 bucket and prefix configuration for report and backup storage.
# Replaces hard-coded local file paths /var/legacy/reports/ and C:\ResortBackups\nightly\
cloud.aws.s3.bucket=${S3_BUCKET_NAME:resorts-lite-reports}
cloud.aws.s3.report-prefix=${S3_REPORT_PREFIX:reports/}
cloud.aws.s3.backup-prefix=${S3_BACKUP_PREFIX:backups/nightly/}

# AWS region configuration
cloud.aws.region.static=${AWS_REGION:us-east-1}

# cr-java-0071 FIX: Service endpoint URLs externalized via environment variables.
# Values should be sourced from AWS Systems Manager Parameter Store in cloud deployments.
app.payment.endpoint=${PAYMENT_API_ENDPOINT:https://payment-svc.internal/payments/charge}
app.inventory.endpoint=${INVENTORY_SERVICE_URL:https://inventory-service.internal/rooms/available}
app.notification.endpoint=${NOTIFICATION_SERVICE_URL:https://notify.internal/send}

# SSM Parameter Store path for report download base URL
app.report.download-url-param=${REPORT_DOWNLOAD_URL_PARAM:/resortslite/report/download-url}

# cr-java-0065 / cr-java-0067 FIX:
# Spring Session Redis configuration for distributed session management.
# Replaces HttpSession in-memory state with Amazon ElastiCache for Redis.
spring.session.store-type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session

# Cache TTL for booking entries in Redis (minutes)
app.cache.booking-ttl-minutes=${BOOKING_CACHE_TTL_MINUTES:60}
