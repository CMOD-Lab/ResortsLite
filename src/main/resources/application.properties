# ResortsLite - Cloud-Native Configuration
# All environment-specific values are externalized per 12-factor app principles.
# Hard-coded infrastructure values have been replaced with environment variable references.

spring.application.name=ResortsLite

# Blocker-12 (cr-java-0077): Port now sourced from environment variable.
# ECS/EKS/Elastic Beanstalk injects SERVER_PORT at runtime for dynamic port binding.
server.port=${SERVER_PORT:8080}

# Database configuration — credentials retrieved from AWS Secrets Manager at runtime.
# Blocker-8,9 (cr-java-0069): No credentials in source code or properties files.
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# AWS Region configuration
cloud.aws.region.static=${AWS_REGION:us-east-1}

# Amazon S3 bucket for report storage (replaces local file system paths)
# Blocker-1,2,3,4,5,6,7 (cr-java-0061, cr-java-0062, cr-java-0063)
cloud.aws.s3.bucket-name=${S3_BUCKET_NAME:resorts-lite-reports}

# AWS Secrets Manager secret names (replaces hard-coded credentials)
# Blocker-8,9 (cr-java-0069), Blocker-18 (cr-java-0090)
AWS_DB_SECRET_NAME=${AWS_DB_SECRET_NAME:resortslite/db/credentials}
AWS_AUTH_SECRET_NAME=${AWS_AUTH_SECRET_NAME:resortslite/auth/credentials}

# AWS SSM Parameter Store parameter paths (replaces hard-coded URLs)
# Blocker-10,11 (cr-java-0071)
SSM_REPORT_DOWNLOAD_URL_PARAM=${SSM_REPORT_DOWNLOAD_URL_PARAM:/resortslite/report/download-base-url}
SSM_INVENTORY_URL_PARAM=${SSM_INVENTORY_URL_PARAM:/resortslite/inventory/endpoint}

# Payment API URL injected from environment (replaces hard-coded internal IP)
PAYMENT_API_URL=${PAYMENT_API_URL:https://payment-svc.internal/charge}

# Amazon ElastiCache for Redis — Spring Session and distributed cache
# Blocker-13,14,15,16,17 (cr-java-0065), Blocker-20 (cr-java-0067)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}

# Spring Session backed by Redis for distributed, stateless session management
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session
