spring.application.name=ResortsLite

# Server port — externalised to environment variable for cloud/container compatibility
# (cr-java-0021, czr-port-001): Dynamic port assignment supported via PORT env var
server.port=${PORT:8080}

# PostgreSQL 16 DataSource Configuration
# Connection URL externalised to environment variable (cr-java-0021):
# Set DB_URL, DB_USERNAME, DB_PASSWORD in AWS Parameter Store / Secrets Manager
# or as container environment variables before deployment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resortdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings (HikariCP — Spring Boot default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate settings for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Externalised service endpoints (cr-java-0021, cr-java-0088):
# Override via environment variables; defaults point to localhost for local dev only.
# In production, set these to HTTPS endpoints via Parameter Store / Secrets Manager.
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal/send}

# Report storage — externalised for container compatibility (czr-java-001)
# In production, point to an S3 bucket path or mounted volume via environment variable.
app.report.base-path=${REPORT_BASE_PATH:/tmp/reports/}
