# ResortsLite - Cloud-Ready Configuration for Azure
spring.application.name=ResortsLite

# Blocker-12 (cr-java-0077): Port is now configurable via SERVER_PORT environment variable.
# Azure Container Apps / AKS can override this at deployment time without code changes.
server.port=${SERVER_PORT:8080}

# Database configuration — credentials are managed by Azure Key Vault (blockers 8-9, cr-java-0069).
# The datasource URL can be overridden via environment variable for different environments.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Blocker-8/9 (cr-java-0069): Azure Key Vault URI for retrieving secrets at runtime.
# Set AZURE_KEYVAULT_URI environment variable in Azure App Service / Container Apps.
azure.keyvault.uri=${AZURE_KEYVAULT_URI:}

# Blocker-1/2/3/4/5/6/7 (cr-java-0061/0062/0063): Azure Blob Storage connection string.
# Set AZURE_STORAGE_CONNECTION_STRING environment variable or use Managed Identity.
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}

# Blocker-10/11 (cr-java-0071): Service endpoints externalized to Azure App Configuration.
# Override via environment variables or Azure App Configuration service at runtime.
app.inventory.endpoint=${APP_INVENTORY_ENDPOINT:https://inventory-service.internal:8081/rooms/available}
app.payment.endpoint=${APP_PAYMENT_ENDPOINT:https://payment-svc.internal:9090/charge}
app.notification.endpoint=${APP_NOTIFICATION_ENDPOINT:https://notify.internal:7070/send}

# Blocker-11 (cr-java-0071): Report base URL externalized — no hard-coded URL in source code.
app.report.base-url=${APP_REPORT_BASE_URL:https://reports.resorts-internal.com}
