# ResortsLite - Cloud-Ready Configuration (AWS)
# All hard-coded infrastructure values have been externalized per cloud-native 12-factor principles.

spring.application.name=ResortsLite

# blocker-12: cr-java-0077 — Port is now driven by SERVER_PORT environment variable.
# ECS/EKS/Elastic Beanstalk injects SERVER_PORT at runtime; defaults to 8080 for local dev.
server.port=${SERVER_PORT:8080}

# ─── Database ────────────────────────────────────────────────────────────────
# blocker-8, blocker-9: cr-java-0069 — DB credentials are no longer hard-coded.
# In production, spring.datasource.url/username/password are injected via environment
# variables populated from AWS Secrets Manager (secret: resortslite/db/credentials).
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── AWS Secrets Manager ─────────────────────────────────────────────────────
# blocker-8, blocker-9: cr-java-0069 — Secret name for database credentials
cloud.aws.secretsmanager.db-secret-name=${DB_SECRET_NAME:resortslite/db/credentials}
# blocker-18: cr-java-0090 — Secret name for authentication credentials
cloud.aws.secretsmanager.auth-secret-name=${AUTH_SECRET_NAME:resortslite/auth/credentials}

# ─── AWS S3 ──────────────────────────────────────────────────────────────────
# blocker-1 to blocker-7: cr-java-0061, cr-java-0062, cr-java-0063
# S3 bucket for report storage — replaces /var/legacy/reports/ and C:\ResortBackups\nightly\
cloud.aws.s3.reports-bucket=${REPORTS_S3_BUCKET:resorts-lite-reports}
cloud.aws.s3.backup-prefix=${BACKUP_S3_PREFIX:nightly-backups/}

# ─── AWS SSM Parameter Store ─────────────────────────────────────────────────
# blocker-10, blocker-11: cr-java-0071 — Service endpoints externalized; no hard-coded URLs.
# Values are injected from AWS SSM Parameter Store at deployment time.
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal/send}
# blocker-11: cr-java-0071 — Report download base URL from SSM Parameter Store
app.report.download.base-url=${REPORT_DOWNLOAD_BASE_URL:}

# ─── Amazon ElastiCache for Redis (Spring Session + Cache) ───────────────────
# blocker-13 to blocker-17: cr-java-0065 — Distributed session management via Redis
# blocker-20: cr-java-0067 — Distributed cache with TTL via Redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session

# ─── AWS Region ──────────────────────────────────────────────────────────────
cloud.aws.region.static=${AWS_REGION:us-east-1}
cloud.aws.region.auto=false
