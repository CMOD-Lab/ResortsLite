# ResortsLite — Cloud-Native Configuration (GCP)
spring.application.name=ResortsLite

# -----------------------------------------------------------------------
# Server port: read from PORT env-var (Cloud Run injects PORT=8080) or
# falls back to 8080.  No hard-coded value in source code (blocker-12).
# -----------------------------------------------------------------------
server.port=${PORT:8080}

# -----------------------------------------------------------------------
# H2 in-memory datasource (dev/test).  In production, replace with a
# Cloud SQL connection string injected via Secret Manager / env-vars.
# -----------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------
# GCP project — required by Secret Manager and GCS clients (blocker-8/9/18)
# -----------------------------------------------------------------------
gcp.project.id=${GCP_PROJECT_ID:my-gcp-project}

# -----------------------------------------------------------------------
# Google Cloud Storage bucket for report files (blocker-1/2/3/4/5/6/7)
# -----------------------------------------------------------------------
gcs.report.bucket=${GCS_REPORT_BUCKET:resorts-reports-bucket}

# -----------------------------------------------------------------------
# Externalised service endpoints — no hard-coded URLs or ports (blocker-10/11)
# -----------------------------------------------------------------------
app.payment.endpoint=${PAYMENT_API_URL:https://payment-svc.internal/payments/charge}
app.inventory.endpoint=${INVENTORY_URL:https://inventory-service.internal/rooms/available}
app.notification.endpoint=${NOTIFICATION_URL:https://notify.internal/send}
app.report.download.url=${REPORT_DOWNLOAD_URL:https://reports.resorts-internal.com/download}

# -----------------------------------------------------------------------
# Spring Session — backed by Google Cloud Memorystore for Redis
# Replaces HttpSession state storage (blocker-13/14/15/16/17)
# -----------------------------------------------------------------------
spring.session.store-type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
