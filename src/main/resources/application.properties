# ResortsLite - Cloud-Native Configuration
# All environment-specific values are injected via environment variables or
# AWS Systems Manager Parameter Store — no hard-coded credentials or endpoints.

spring.application.name=ResortsLite

# Server port: read from environment variable SERVER_PORT (set by ECS/EKS/Beanstalk)
# Falls back to 8080 for local development only
server.port=${SERVER_PORT:8080}

# ─── Database ────────────────────────────────────────────────────────────────
# Credentials are retrieved from AWS Secrets Manager at runtime by BookingService.
# The datasource URL, username, and password below are for local H2 development only.
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── AWS Secrets Manager ─────────────────────────────────────────────────────
# Secret name containing DB credentials JSON: { "host": "...", "username": "...", "password": "..." }
cloud.aws.secretsmanager.db-secret-name=${DB_SECRET_NAME:resortslite/db/credentials}
# Secret name containing auth credentials managed via Amazon Cognito / Secrets Manager
cloud.aws.secretsmanager.auth-secret-name=${AUTH_SECRET_NAME:resortslite/auth/credentials}

# ─── AWS S3 (Report & Backup Storage) ────────────────────────────────────────
# Replaces hard-coded /var/legacy/reports/ and C:\ResortBackups\nightly\ paths
cloud.aws.s3.report-bucket=${REPORT_S3_BUCKET:resorts-lite-reports}
cloud.aws.s3.report-prefix=${REPORT_S3_PREFIX:reports/}
cloud.aws.s3.backup-prefix=${BACKUP_S3_PREFIX:backups/nightly/}

# ─── AWS SSM Parameter Store ─────────────────────────────────────────────────
# Parameter name for the report download base URL (replaces hard-coded HTTP URL)
cloud.aws.ssm.report-url-param=${REPORT_URL_SSM_PARAM:/resortslite/report/download-url}

# ─── Internal Service Endpoints (from SSM Parameter Store / environment) ─────
# Replaces hard-coded http://payment-svc.internal:9090/charge
app.payment.endpoint=${PAYMENT_API_ENDPOINT:https://payment-svc.internal/charge}
# Replaces hard-coded http://inventory-svc.internal:8081/rooms
app.inventory.endpoint=${INVENTORY_SERVICE_URL:https://inventory-svc.internal/rooms}
# Replaces hard-coded http://notify.internal:7070/send
app.notification.endpoint=${NOTIFICATION_SERVICE_URL:https://notify.internal/send}

# ─── Amazon ElastiCache for Redis (Spring Session + Distributed Cache) ────────
# Replaces in-memory HttpSession and static HashMap with distributed Redis store
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}

# Spring Session: store sessions in Redis (ElastiCache) for stateless instances
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:session
# Session timeout — configurable via environment variable
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}

# ─── Cache TTL Configuration ──────────────────────────────────────────────────
cache.booking.ttl-minutes=${BOOKING_CACHE_TTL_MINUTES:60}
cache.session.ttl-minutes=${SESSION_CACHE_TTL_MINUTES:30}

# ─── AWS Region ───────────────────────────────────────────────────────────────
cloud.aws.region.static=${AWS_REGION:us-east-1}
cloud.aws.region.auto=false
