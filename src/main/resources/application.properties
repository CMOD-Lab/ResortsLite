# ResortsLite - Cloud-Native Configuration
# All environment-specific values are externalised to environment variables,
# AWS Systems Manager Parameter Store, or AWS Secrets Manager.

spring.application.name=ResortsLite

# FIX czr-port-001 / cr-java-0077: Server port read from environment variable.
# ECS/EKS injects SERVER_PORT at runtime; defaults to 8080 for local development.
server.port=${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Database — credentials are fetched from AWS Secrets Manager at runtime.
# The JDBC URL is externalised to an environment variable.
# FIX cr-java-0069: No credentials in source code or property files.
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# AWS Region — required by all AWS SDK v2 clients.
# ---------------------------------------------------------------------------
cloud.aws.region.static=${AWS_REGION:us-east-1}

# ---------------------------------------------------------------------------
# AWS Secrets Manager — secret name for DB credentials.
# FIX cr-java-0069 / cr-java-0090: Credentials retrieved from Secrets Manager.
# ---------------------------------------------------------------------------
cloud.aws.secretsmanager.db-secret-name=${DB_SECRET_NAME:resortslite/db/credentials}

# ---------------------------------------------------------------------------
# Amazon S3 — bucket for report storage.
# FIX cr-java-0061 / cr-java-0062 / cr-java-0063: Replaces local file paths.
# ---------------------------------------------------------------------------
cloud.aws.s3.report-bucket=${REPORT_S3_BUCKET:resorts-reports-bucket}

# ---------------------------------------------------------------------------
# Spring Session — backed by Amazon ElastiCache for Redis.
# FIX cr-java-0065: Distributed session management; no server affinity required.
# ---------------------------------------------------------------------------
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session

# ---------------------------------------------------------------------------
# Spring Cache — backed by Redis with TTL.
# FIX cr-java-0067: Replaces unbounded in-memory HashMap cache.
# ---------------------------------------------------------------------------
spring.cache.type=redis
spring.cache.redis.time-to-live=1800000

# ---------------------------------------------------------------------------
# Redis / Amazon ElastiCache connection.
# FIX cr-java-0065 / cr-java-0067: Centralised cache and session store.
# ---------------------------------------------------------------------------
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}

# ---------------------------------------------------------------------------
# Internal service endpoints — externalised to environment variables.
# FIX cr-java-0071: No hard-coded environment-specific URLs.
# Values are also retrievable from AWS SSM Parameter Store at runtime.
# ---------------------------------------------------------------------------
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal/send}
app.report.download.url=${REPORT_DOWNLOAD_URL:https://reports.resorts-internal.com/download}
