# ResortsLite - Application Configuration
spring.application.name=ResortsLite

# Updated: Server port externalised to environment variable.
# Container orchestration (ECS/EKS) dynamically assigns ports; hardcoded ports
# prevent dynamic port binding required for modern container deployment.
# Fix for: czr-port-001 [Software Portability]
server.port=${SERVER_PORT:8080}

# Updated: PostgreSQL 16 connection string replacing H2 in-memory database.
# Credentials and host externalised to environment variables — must be provided
# via AWS Parameter Store, Secrets Manager, or container environment injection.
# Fix for: cr-java-0021 [Cloud Compatibility / Mandatory]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resortdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# PostgreSQL connection pool settings (HikariCP defaults tuned for cloud deployment)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Updated: Schema initialisation mode for PostgreSQL
spring.sql.init.mode=always
spring.sql.init.platform=postgresql

# Updated: Internal service endpoints externalised to environment variables.
# Hardcoded internal hostnames are non-routable in cloud VPC environments
# without manual DNS configuration.
# Fix for: cr-java-0021 [Cloud Compatibility / Mandatory]
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal:7070/send}

# Updated: Report base path externalised to environment variable.
# Hardcoded absolute paths do not exist inside container images.
# Fix for: czr-java-001 [Software Portability / Mandatory]
app.report.base-path=${REPORT_BASE_PATH:/tmp/reports/}
