# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
# cr-java-0077 FIX: Hard-coded port replaced with environment variable injection.
# Resolution order:
#   1. AWS SSM Parameter Store: /resortslite/server/port  (loaded via Spring Cloud AWS)
#   2. Environment variable:    SERVER_PORT
#   3. Default fallback:        8080  (development only — override in all cloud environments)
# In ECS/EKS/Elastic Beanstalk, set the SERVER_PORT environment variable or store the
# port value in SSM Parameter Store under /resortslite/server/port.
server.port=${SERVER_PORT:8080}

# cr-java-0077 FIX: Application-level server port property for @Value injection in ReportService.
# Sourced from AWS SSM Parameter Store (/resortslite/server/port) via Spring Cloud AWS,
# or falls back to the SERVER_PORT environment variable.
app.server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# AWS S3 configuration — replaces hard-coded file paths (cr-java-0061)
# Override these via environment variables in cloud deployments:
#   AWS_S3_BUCKET_NAME, AWS_S3_BACKUP_PREFIX, AWS_REGION
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:resorts-lite-reports}
aws.s3.backup-prefix=${AWS_S3_BACKUP_PREFIX:backups/nightly/}
aws.region=${AWS_REGION:us-east-1}

# AWS Secrets Manager — database credentials (cr-java-0069)
# Set AWS_SECRETS_NAME to the name/ARN of the secret that holds DB credentials.
# The secret must be a JSON object with "username" and "password" keys.
# Example: aws secretsmanager create-secret --name resortslite/db/credentials \
#          --secret-string '{"username":"admin","password":"<your-password>"}'
aws.secretsmanager.secret-name=${AWS_SECRETS_NAME:resortslite/db/credentials}

# -----------------------------------------------------------------------
# cr-java-0090 FIX: File-based Authentication — AWS Secrets Manager + Amazon Cognito
# -----------------------------------------------------------------------
# Authentication credentials and user identity are no longer stored in or read from
# local files. All credential storage is handled by AWS Secrets Manager and all user
# identity management is delegated to Amazon Cognito User Pools.
#
# Amazon Cognito User Pool ID.
# Set AWS_COGNITO_USER_POOL_ID to the ID of the Cognito User Pool that manages
# resort application users (e.g. us-east-1_AbCdEfGhI).
aws.cognito.user-pool-id=${AWS_COGNITO_USER_POOL_ID:}
#
# AWS Secrets Manager secret name for the HMAC-SHA256 signing key used to generate
# booking confirmation codes. The secret must be a JSON object with a "signingKey" field:
#   {"signingKey": "<your-base64-or-hex-encoded-key>"}
# Example: aws secretsmanager create-secret --name resortslite/auth/signing-key \
#          --secret-string '{"signingKey":"<your-signing-key>"}'
# Set AWS_SECRETS_AUTH_KEY_NAME to override the default secret name.
aws.secretsmanager.auth-key-name=${AWS_SECRETS_AUTH_KEY_NAME:resortslite/auth/signing-key}

# -----------------------------------------------------------------------
# cr-java-0071 FIX: Hard-coded Environment URLs — AWS SSM Parameter Store
# -----------------------------------------------------------------------
# Inventory service available-rooms endpoint URL (BookingController, original line 66).
# Hard-coded value was: "http://inventory-service.internal:8081/rooms/available"
# In AWS deployments, store the environment-specific URL in SSM Parameter Store under:
#   /resortslite/inventory/available-url
# and configure Spring Cloud AWS to load it:
#   spring.config.import=aws-parameterstore:/resortslite/
# The environment variable APP_INVENTORY_AVAILABLE_URL can be used as a local fallback.
app.inventory.available-url=${APP_INVENTORY_AVAILABLE_URL:https://inventory-service.internal/rooms/available}

# Report download base URL (ReportService, original line 66).
# Hard-coded value was: "http://reports.resorts-internal.com:8080/download/"
# In AWS deployments, store the environment-specific URL in SSM Parameter Store under:
#   /resortslite/report/download-base-url
# and configure Spring Cloud AWS to load it:
#   spring.config.import=aws-parameterstore:/resortslite/
# The environment variable APP_REPORT_DOWNLOAD_BASE_URL can be used as a local fallback.
app.report.download-base-url=${APP_REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download/}

# -----------------------------------------------------------------------
# cr-java-0065 FIX: Spring Session — Amazon ElastiCache for Redis
# -----------------------------------------------------------------------
# Instructs Spring Boot to use Redis as the HTTP session store, replacing the
# in-process HttpSession that was bound to a single EC2 instance. With Redis-backed
# sessions, all application instances share the same session data, enabling stateless
# horizontal scaling without sticky sessions on the AWS ALB.
#
# In AWS deployments, set the following environment variables (or store them in
# AWS SSM Parameter Store under /resortslite/redis/):
#   SPRING_REDIS_HOST     — ElastiCache primary endpoint (e.g. my-cluster.abc123.ng.0001.use1.cache.amazonaws.com)
#   SPRING_REDIS_PORT     — ElastiCache port (default 6379)
#   SPRING_REDIS_PASSWORD — ElastiCache auth token (required when in-transit encryption is enabled)
#
# Session TTL is controlled by @EnableRedisHttpSession(maxInactiveIntervalInSeconds=1800)
# in RedisSessionConfig.java (30 minutes). Adjust as needed for your application.
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=spring:session:resortslite

# Amazon ElastiCache for Redis connection properties.
# Override via environment variables or AWS SSM Parameter Store in cloud deployments.
# Local development default: localhost:6379 (no password).
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.password=${SPRING_REDIS_PASSWORD:}
# Enable SSL/TLS for ElastiCache in-transit encryption (set to true in production).
spring.redis.ssl=${SPRING_REDIS_SSL:false}
# Connection timeout (milliseconds).
spring.redis.timeout=${SPRING_REDIS_TIMEOUT:2000}

# -----------------------------------------------------------------------
# cr-java-0067 FIX: In-Memory Caching Without TTL — Amazon ElastiCache for Redis
# -----------------------------------------------------------------------
# The static in-memory bookingCache HashMap in BookingController has been replaced
# with Amazon ElastiCache for Redis via Spring's RedisTemplate. Cache entries are
# stored with an explicit TTL to prevent unbounded memory growth and ensure cache
# consistency across all EC2 instances in the Auto Scaling Group.
#
# Booking cache TTL in minutes. After this period, cache entries expire automatically
# and subsequent lookups fall through to BookingService.getBookingById().
# In AWS deployments, store the TTL value in SSM Parameter Store under:
#   /resortslite/booking/cache-ttl-minutes
# or override via environment variable APP_BOOKING_CACHE_TTL_MINUTES.
# Default: 60 minutes.
app.booking.cache.ttl-minutes=${APP_BOOKING_CACHE_TTL_MINUTES:60}
