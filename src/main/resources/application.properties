# ResortsLite - Cloud-Native Configuration
# All environment-specific values are supplied via environment variables or
# AWS Systems Manager Parameter Store at runtime (12-factor app principle).

spring.application.name=ResortsLite

# -----------------------------------------------------------------------
# Server port — read from environment variable SERVER_PORT (cr-java-0077).
# ECS / EKS injects the correct port at deploy time.
# -----------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# -----------------------------------------------------------------------
# Datasource — credentials are resolved from AWS Secrets Manager at
# application startup inside BookingService (cr-java-0069).
# The JDBC URL is supplied via environment variable to avoid hard-coding
# host names in source code (cr-java-0071).
# -----------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------
# Spring Session — use Redis (Amazon ElastiCache) for distributed session
# storage (cr-java-0065). Replaces server-local HttpSession.
# -----------------------------------------------------------------------
spring.session.store-type=redis
spring.session.timeout=3600

# -----------------------------------------------------------------------
# Redis / ElastiCache connection — host and port supplied via environment
# variables so they can differ between environments without code changes.
# -----------------------------------------------------------------------
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}

# -----------------------------------------------------------------------
# AWS region — required by AWS SDK v2 clients (S3, Secrets Manager, SSM).
# -----------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}

# -----------------------------------------------------------------------
# Externalized service endpoints — values are resolved from AWS Systems
# Manager Parameter Store at runtime (cr-java-0071).
# These properties serve as fallback defaults when SSM is unavailable.
# -----------------------------------------------------------------------
app.payment.endpoint=${PAYMENT_API_URL:https://payment-svc.internal/payments/charge}
app.inventory.endpoint=${INVENTORY_SERVICE_URL:https://inventory-service.internal/rooms/available}
app.notification.endpoint=${NOTIFICATION_SERVICE_URL:https://notify.internal/send}

# -----------------------------------------------------------------------
# Amazon S3 — bucket name for report storage (cr-java-0061 / cr-java-0062 / cr-java-0063).
# -----------------------------------------------------------------------
app.report.s3.bucket=${REPORT_S3_BUCKET:resorts-reports-bucket}

# -----------------------------------------------------------------------
# AWS Secrets Manager — secret names for DB credentials and Cognito config
# (cr-java-0069, cr-java-0090).
# -----------------------------------------------------------------------
app.db.secret.name=${DB_SECRET_NAME:resortslite/db/credentials}
app.cognito.secret.name=${COGNITO_SECRET_NAME:resortslite/cognito/config}
