# =============================================================================
# ResortsLite — Cloud-Native Application Configuration
# =============================================================================
# All environment-specific values are externalised to environment variables
# populated from AWS SSM Parameter Store / Secrets Manager at deploy time.
# This file contains only safe defaults and Spring wiring — no credentials.
# =============================================================================

spring.application.name=ResortsLite

# -----------------------------------------------------------------------------
# Server port — externalised to environment variable / SSM Parameter Store.
# Replaces hard-coded port 8080 (cr-java-0077 / blocker-12).
# SSM parameter: /resortsLite/server/port
# -----------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# -----------------------------------------------------------------------------
# DataSource — credentials resolved at runtime from AWS Secrets Manager.
# The BookingService @PostConstruct reads the secret and the JdbcTemplate
# is configured by Spring Boot using the properties below.
# Hard-coded DB_HOST, DB_USER, DB_PASS removed (cr-java-0069 / blockers 8-9).
# -----------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------------
# Spring Session — Amazon ElastiCache for Redis (replaces HttpSession).
# Migrates all HTTP session state to distributed Redis cluster so that any
# application instance can serve any request (cr-java-0065 / blockers 13-17).
# -----------------------------------------------------------------------------
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=spring:session

# -----------------------------------------------------------------------------
# Redis / ElastiCache connection.
# Env vars populated from SSM Parameter Store at deploy time.
# SSM parameters: /resortsLite/redis/host, /resortsLite/redis/port
# -----------------------------------------------------------------------------
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.ssl=${REDIS_SSL:false}

# -----------------------------------------------------------------------------
# Booking cache TTL — controls ElastiCache entry expiration.
# Replaces unbounded in-memory HashMap (cr-java-0067 / blocker-20).
# SSM parameter: /resortsLite/cache/bookingTtlMinutes
# -----------------------------------------------------------------------------
booking.cache.ttl-minutes=${BOOKING_CACHE_TTL_MINUTES:30}

# -----------------------------------------------------------------------------
# AWS region — required by AWS SDK v2 clients (S3, Secrets Manager, SSM).
# -----------------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}

# -----------------------------------------------------------------------------
# AWS Secrets Manager — database credentials secret name.
# Replaces hard-coded DB_HOST / DB_USER / DB_PASS (cr-java-0069 / blockers 8-9)
# and file-based authentication (cr-java-0090 / blocker-18).
# -----------------------------------------------------------------------------
aws.db.secret-name=${AWS_DB_SECRET_NAME:resortsLite/db/credentials}

# -----------------------------------------------------------------------------
# Amazon S3 — report storage bucket and prefix.
# Replaces hard-coded /var/legacy/reports/ and C:\ResortBackups\ paths
# (cr-java-0061, cr-java-0062, cr-java-0063 / blockers 1-7).
# SSM parameters: /resortsLite/report/s3Bucket, /resortsLite/report/s3Prefix
# -----------------------------------------------------------------------------
report.s3.bucket=${REPORT_S3_BUCKET:resortsLite-reports}
report.s3.prefix=${REPORT_S3_PREFIX:reports/}

# -----------------------------------------------------------------------------
# Report download base URL — replaces hard-coded http://reports.resorts-internal.com:8080
# (cr-java-0071 / blocker-11).
# SSM parameter: /resortsLite/report/downloadBaseUrl
# -----------------------------------------------------------------------------
report.download.base-url=${REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download/}

# -----------------------------------------------------------------------------
# Inventory service URL — replaces hard-coded http://inventory-service.internal:8081
# (cr-java-0071 / blocker-10).
# SSM parameter: /resortsLite/inventory/serviceUrl
# -----------------------------------------------------------------------------
inventory.service.url=${INVENTORY_SERVICE_URL:https://inventory-service.internal/rooms/available}

# -----------------------------------------------------------------------------
# Payment API URL — replaces hard-coded http://10.0.1.45:9090/payments/charge.
# SSM parameter: /resortsLite/payment/apiUrl
# -----------------------------------------------------------------------------
payment.api.url=${PAYMENT_API_URL:https://payment-svc.internal/payments/charge}
