# ResortsLite - Application Configuration
spring.application.name=ResortsLite

# Server port — override via SERVER_PORT environment variable for container deployments
server.port=${SERVER_PORT:8080}

# PostgreSQL datasource configuration (migrated from H2/MySQL to PostgreSQL 16)
# For production, externalise credentials to AWS Parameter Store / Secrets Manager
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resortdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool settings optimised for PostgreSQL
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / JDBC schema initialisation
spring.sql.init.mode=always

# Internal service endpoints — externalise to environment variables for cloud deployments
# Use HTTPS endpoints in production environments
app.payment.endpoint=${APP_PAYMENT_ENDPOINT:http://payment-svc.internal:9090/charge}
app.inventory.endpoint=${APP_INVENTORY_ENDPOINT:http://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${APP_NOTIFICATION_ENDPOINT:http://notify.internal:7070/send}
