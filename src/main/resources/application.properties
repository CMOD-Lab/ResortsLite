# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# ---------------------------------------------------------------------------
# cr-java-0090: Azure Active Directory (Entra ID) — File-based Authentication fix
# ---------------------------------------------------------------------------
# Replace local file-based credential storage with Azure AD authentication.
# Spring Cloud Azure AD starter integrates with Spring Security to validate
# OAuth 2.0 / OIDC JWT tokens issued by Azure AD for every incoming request.
#
# Required environment variables for Azure AD integration:
#   AZURE_AD_TENANT_ID   — Azure AD tenant ID (found in Azure Portal > Azure AD > Overview)
#   AZURE_AD_CLIENT_ID   — Application (client) ID registered in Azure AD App Registrations
#   AZURE_AD_CLIENT_SECRET — Client secret from Azure AD App Registration (store in Key Vault)
#
# Register the application in Azure AD:
#   1. Azure Portal > Azure Active Directory > App registrations > New registration
#   2. Set redirect URI to: https://<your-app-domain>/login/oauth2/code/azure
#   3. Under "Expose an API", add scope: api://<client-id>/Booking.ReadWrite
#   4. Grant the Managed Identity "Key Vault Secrets User" role on the Key Vault
#
# The application acts as an OAuth2 Resource Server: it validates the Bearer JWT
# issued by Azure AD without storing any credentials locally.
spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.credential.tenant-id=${AZURE_AD_TENANT_ID:common}
spring.cloud.azure.active-directory.credential.client-id=${AZURE_AD_CLIENT_ID:}
spring.cloud.azure.active-directory.credential.client-secret=${AZURE_AD_CLIENT_SECRET:}
spring.cloud.azure.active-directory.profile.tenant-id=${AZURE_AD_TENANT_ID:common}
# Resource server mode: validate incoming Bearer tokens issued by Azure AD
spring.cloud.azure.active-directory.application-type=resource-server

# cr-java-0077: Hard-coded port externalized to SERVER_PORT environment variable
# (Azure App Configuration). Previously hard-coded as server.port=8080, which prevents
# dynamic port assignment by Azure Container Apps / AKS orchestration platforms.
# Set SERVER_PORT environment variable in Azure App Configuration or deployment manifest.
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# Azure Blob Storage configuration (cr-java-0061: replaces hard-coded file paths)
# Set AZURE_STORAGE_CONNECTION_STRING environment variable in cloud deployment
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=https;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OGLjX+N30byI=;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;}
# Container names — override via environment variables for different environments
azure.storage.reports-container=${AZURE_STORAGE_REPORTS_CONTAINER:reports}
azure.storage.backup-container=${AZURE_STORAGE_BACKUP_CONTAINER:backups}

# cr-java-0069: Azure Key Vault configuration for externalized DB credentials.
# Set AZURE_KEYVAULT_URI to your Key Vault endpoint, e.g.:
#   https://<your-vault-name>.vault.azure.net/
# When running on Azure (App Service, AKS, Container Apps), assign a Managed Identity
# to the application and grant it "Key Vault Secrets User" role on the vault.
# Locally, authenticate via: az login  (DefaultAzureCredential picks up CLI credentials).
azure.keyvault.uri=${AZURE_KEYVAULT_URI:}

# cr-java-0069: DB host externalised from hard-coded constant to environment-backed property.
app.db.host=${DB_HOST:db-prod.resorts-internal.com}

# cr-java-0071: Externalized hard-coded environment-specific URLs (Hard-coded Environment URLs).
# These values were previously hard-coded directly in Java source files, preventing portability
# across cloud environments. They are now resolved from environment variables / Azure App
# Configuration at runtime, enabling environment-agnostic deployments.
#
# Inventory service URL (was hard-coded in BookingController.java line 66)
# Override via environment variable: APP_INVENTORY_URL
app.inventory.url=${APP_INVENTORY_URL:http://inventory-service.internal:8081/rooms/available}
#
# Report download base URL (was hard-coded in ReportService.java line 66)
# Override via environment variable: APP_REPORTS_DOWNLOAD_BASE_URL
app.reports.download-base-url=${APP_REPORTS_DOWNLOAD_BASE_URL:http://reports.resorts-internal.com:8080/download/}

# ---------------------------------------------------------------------------
# cr-java-0065: Azure Cache for Redis — replaces HttpSession in-memory state
# ---------------------------------------------------------------------------
# Set AZURE_REDIS_HOST to your Azure Cache for Redis hostname, e.g.:
#   <cache-name>.redis.cache.windows.net
# Set AZURE_REDIS_PASSWORD to the primary/secondary access key from the portal.
# Set AZURE_REDIS_PORT to 6380 (TLS) for production; 6379 for local dev.
spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6379}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.redis.ssl=${AZURE_REDIS_SSL:false}

# Spring Session — store sessions in Redis (enables stateless app instances)
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:session

# cr-java-0065: Session TTL — controls how long booking state is retained in Redis.
# Override via APP_SESSION_TTL_SECONDS environment variable.
app.session.ttl-seconds=${APP_SESSION_TTL_SECONDS:1800}

# ---------------------------------------------------------------------------
# cr-java-0067: Azure Cache for Redis — replaces static in-memory bookingCache (HashMap)
# ---------------------------------------------------------------------------
# Booking cache TTL — controls how long serialized booking data is retained in Redis
# before automatic eviction. Prevents indefinite memory growth and stale data
# inconsistencies across multiple application instances.
# Override via APP_BOOKING_CACHE_TTL_SECONDS environment variable.
app.booking.cache.ttl-seconds=${APP_BOOKING_CACHE_TTL_SECONDS:3600}

# ---------------------------------------------------------------------------
# cr-java-0111: Azure Service Bus — replaces java.util.Timer / server-local clock
# ---------------------------------------------------------------------------
# Migrate from server-local scheduling (java.util.Timer, SimpleDateFormat + new Date())
# to Azure Service Bus scheduled message delivery for distributed, timezone-agnostic
# task execution across multiple regions and container replicas.
#
# Required environment variables:
#   AZURE_SERVICEBUS_CONNECTION_STRING — Primary/secondary connection string from the
#       Azure Service Bus namespace (Azure Portal > Service Bus > Shared access policies).
#       In production, prefer Managed Identity + RBAC ("Azure Service Bus Data Sender"
#       role) and replace the connection string with the namespace FQDN.
#   AZURE_SERVICEBUS_REPORT_QUEUE_NAME — Name of the Service Bus queue that receives
#       scheduled report-generation messages (default: report-schedule-queue).
#
# All scheduled enqueue times are expressed in UTC (OffsetDateTime / ISO-8601) so that
# scheduling behaviour is consistent regardless of the JVM/container timezone setting.
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.report-queue-name=${AZURE_SERVICEBUS_REPORT_QUEUE_NAME:report-schedule-queue}
