# ResortsLite - Cloud-Native Configuration
# All environment-specific values are externalized and injected at runtime
# via ECS task definition environment variables, Elastic Beanstalk env config,
# or AWS Systems Manager Parameter Store.

spring.application.name=ResortsLite

# -------------------------------------------------------------------------
# Server port — read from SERVER_PORT environment variable injected by ECS/EKS.
# Defaults to 8080 for local development.
# FIX cr-java-0077: no hard-coded port in application logic or properties.
# -------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# -------------------------------------------------------------------------
# Database — connection details are resolved from AWS Secrets Manager at
# runtime by BookingService.  The datasource URL here uses H2 in-memory for
# local development; in production the JDBC URL is overridden via env var.
# FIX cr-java-0069: credentials are NOT stored here — they come from Secrets Manager.
# -------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------------------------------------------------------
# Amazon ElastiCache for Redis — Spring Session + RedisTemplate
# FIX cr-java-0065 / cr-java-0067: session state and booking cache stored in Redis.
# Host/port injected at runtime via REDIS_HOST / REDIS_PORT environment variables.
# -------------------------------------------------------------------------
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=resortsLite:session

# -------------------------------------------------------------------------
# Booking cache TTL (seconds) — default 30 minutes
# -------------------------------------------------------------------------
app.booking.cache.ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:1800}

# -------------------------------------------------------------------------
# Internal service endpoints — injected at runtime via environment variables
# or overridden from AWS Systems Manager Parameter Store.
# FIX cr-java-0071: no hard-coded environment-specific URLs in source code.
# -------------------------------------------------------------------------
app.inventory.endpoint=${APP_INVENTORY_ENDPOINT:https://inventory-svc.internal/rooms}
app.payment.endpoint=${APP_PAYMENT_ENDPOINT:https://payment-svc.internal/payments/charge}
app.notification.endpoint=${APP_NOTIFICATION_ENDPOINT:https://notify.internal/send}

# -------------------------------------------------------------------------
# AWS configuration — region injected at runtime
# -------------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}

# -------------------------------------------------------------------------
# Amazon S3 — report storage bucket
# FIX cr-java-0061 / cr-java-0062 / cr-java-0063: S3 bucket name injected at runtime.
# -------------------------------------------------------------------------
app.report.s3.bucket=${REPORT_S3_BUCKET:resortsLite-reports}

# -------------------------------------------------------------------------
# AWS Secrets Manager — secret names injected at runtime
# FIX cr-java-0069 / cr-java-0090
# -------------------------------------------------------------------------
app.db.secret.name=${DB_SECRET_NAME:resortsLite/db/credentials}
app.cognito.secret.name=${COGNITO_SERVICE_SECRET_NAME:resortsLite/cognito/serviceSecret}
