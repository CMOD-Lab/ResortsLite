# =============================================================================
# ResortsLite — Cloud-Native Application Configuration
# =============================================================================
# All environment-specific values are injected via environment variables.
# Hard-coded hostnames, credentials, and ports have been removed.
# =============================================================================

spring.application.name=ResortsLite

# -----------------------------------------------------------------------------
# Server port — cr-java-0077 FIX
# Resolved from SERVER_PORT environment variable injected by ECS / EKS /
# Elastic Beanstalk at runtime.  Default 8080 is used for local development only.
# -----------------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# -----------------------------------------------------------------------------
# DataSource — cr-java-0069 FIX
# Database credentials are loaded from AWS Secrets Manager by BookingService.
# Spring Boot datasource properties use environment variables injected by the
# ECS task definition / EKS pod spec so that no credentials appear in source.
# -----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------------
# Spring Session — cr-java-0065 FIX
# HTTP session state is stored in Amazon ElastiCache for Redis via Spring Session,
# enabling stateless application instances and safe horizontal scaling.
# -----------------------------------------------------------------------------
spring.session.store-type=redis
spring.session.timeout=3600s
spring.session.redis.namespace=spring:session

# -----------------------------------------------------------------------------
# Redis / ElastiCache — cr-java-0065 / cr-java-0067 FIX
# Connection details injected via environment variables set in the ECS task
# definition or EKS ConfigMap/Secret.
# -----------------------------------------------------------------------------
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}

# -----------------------------------------------------------------------------
# AWS Configuration
# Region and credential chain are resolved by the AWS SDK default provider.
# -----------------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}

# -----------------------------------------------------------------------------
# AWS Secrets Manager — cr-java-0069 / cr-java-0090 FIX
# Secret names for database credentials and authentication configuration.
# These names are environment-specific and injected at deployment time.
# -----------------------------------------------------------------------------
aws.secrets.db-secret-name=${DB_SECRET_NAME:resorts/prod/db-credentials}
aws.secrets.auth-secret-name=${AUTH_SECRET_NAME:resorts/prod/auth-config}

# -----------------------------------------------------------------------------
# AWS SSM Parameter Store — cr-java-0071 FIX
# Parameter names for environment-specific service URLs.
# Actual URL values are stored in SSM Parameter Store, not here.
# -----------------------------------------------------------------------------
aws.ssm.inventory-url-param=${INVENTORY_URL_PARAM:/resorts/inventory/service-url}
aws.ssm.report-download-url-param=${REPORT_DOWNLOAD_URL_PARAM:/resorts/report/download-base-url}

# -----------------------------------------------------------------------------
# Amazon S3 — cr-java-0061 / cr-java-0062 / cr-java-0063 FIX
# S3 bucket and key prefix configuration for report storage.
# Replaces hard-coded local file paths (/var/legacy/reports/, C:\ResortBackups\).
# -----------------------------------------------------------------------------
aws.s3.reports-bucket=${REPORTS_S3_BUCKET:resorts-reports-bucket}
aws.s3.reports-prefix=${REPORTS_S3_PREFIX:monthly-reports/}
aws.s3.backup-prefix=${BACKUP_S3_PREFIX:nightly-backups/}

# -----------------------------------------------------------------------------
# Cache TTL — cr-java-0067 FIX
# Booking cache TTL in minutes; stored in Redis with expiration.
# -----------------------------------------------------------------------------
booking.cache.ttl-minutes=${BOOKING_CACHE_TTL_MINUTES:30}
session.ttl-minutes=${SESSION_TTL_MINUTES:60}
