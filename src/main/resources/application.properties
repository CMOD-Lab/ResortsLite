# ============================================================
# ResortsLite — Cloud-Ready Configuration (Azure)
# All hard-coded values replaced with environment variables
# and Azure-native service references per cloud readiness fixes.
# ============================================================

spring.application.name=ResortsLite

# cr-java-0077: Server port externalized — container orchestration (Azure Container Apps /
# AKS) can override via SERVER_PORT environment variable for dynamic port assignment.
server.port=${SERVER_PORT:8080}

# ------------------------------------------------------------
# Datasource — credentials resolved from Azure Key Vault at runtime (cr-java-0069)
# ------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ------------------------------------------------------------
# Azure Key Vault — replaces hard-coded DB credentials (cr-java-0069)
# Set AZURE_KEYVAULT_URI in the deployment environment or Azure App Configuration.
# ------------------------------------------------------------
azure.keyvault.uri=${AZURE_KEYVAULT_URI:}
azure.keyvault.secret.db-user=db-user
azure.keyvault.secret.db-pass=db-pass

# ------------------------------------------------------------
# Azure Blob Storage — replaces local file system operations (cr-java-0061/0062/0063)
# Set AZURE_STORAGE_BLOB_ENDPOINT in the deployment environment.
# ------------------------------------------------------------
azure.storage.blob.endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:}
azure.storage.blob.container-name=${AZURE_STORAGE_CONTAINER_NAME:reports}

# ------------------------------------------------------------
# Azure Service Bus — replaces java.util.Timer scheduling (cr-java-0111)
# Set AZURE_SERVICEBUS_CONNECTION_STRING in the deployment environment.
# ------------------------------------------------------------
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.queue-name=${AZURE_SERVICEBUS_QUEUE_NAME:report-schedule-queue}

# ------------------------------------------------------------
# Azure Active Directory — replaces file-based authentication (cr-java-0090)
# Configure tenant-id and client-id via environment variables or Azure App Configuration.
# ------------------------------------------------------------
spring.cloud.azure.active-directory.enabled=${AZURE_AD_ENABLED:false}
spring.cloud.azure.active-directory.profile.tenant-id=${AZURE_TENANT_ID:}
spring.cloud.azure.active-directory.credential.client-id=${AZURE_CLIENT_ID:}
spring.cloud.azure.active-directory.credential.client-secret=${AZURE_CLIENT_SECRET:}

# ------------------------------------------------------------
# Redis (Azure Cache for Redis) — replaces in-memory session & cache (cr-java-0065/0067)
# Set REDIS_HOST and REDIS_PASSWORD in the deployment environment.
# ------------------------------------------------------------
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=spring:session

# Cache TTL for booking entries (minutes)
app.cache.booking.ttl-minutes=${BOOKING_CACHE_TTL_MINUTES:60}

# ------------------------------------------------------------
# Service endpoints — externalized from hard-coded values (cr-java-0071)
# Override via Azure App Configuration or environment variables per deployment environment.
# ------------------------------------------------------------
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal/payments/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal/rooms/available}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal/send}
app.report.download.base-url=${REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com}
