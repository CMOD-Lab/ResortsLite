# ResortsLite - Application Configuration
spring.application.name=ResortsLite

# Server port — externalised to environment variable for container/cloud compatibility.
# Falls back to 8080 for local development.
# Rule: czr-port-001 [Software Portability] — fixed port replaced with dynamic binding.
server.port=${SERVER_PORT:8080}

# PostgreSQL DataSource Configuration
# Connection URL, credentials, and driver externalised to environment variables.
# Rule: cr-java-0021 [Cloud Compatibility / Mandatory] — hardcoded DB hostname and
# credentials replaced with environment variable references for AWS Parameter Store /
# Secrets Manager compatibility.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resortdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings — tuned for PostgreSQL 16
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JDBC initialisation — create schema on startup for development convenience
spring.sql.init.mode=always

# Internal service endpoints — externalised to environment variables.
# Rule: cr-java-0021 [Cloud Compatibility / Mandatory] — hardcoded internal hostnames
# replaced with environment variable references; non-routable in cloud VPC without DNS.
app.payment.endpoint=${PAYMENT_ENDPOINT:http://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:http://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:http://notify.internal:7070/send}

# Report storage path — externalised to environment variable for container compatibility.
# Rule: czr-java-001 [Software Portability / Mandatory] — hardcoded /var/legacy/reports
# replaced with configurable path via environment variable.
app.report.base-path=${REPORT_BASE_PATH:/tmp/reports/}
