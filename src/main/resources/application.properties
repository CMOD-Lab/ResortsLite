# ResortsLite - Cloud-Native Configuration (AWS)
spring.application.name=ResortsLite

# -----------------------------------------------------------------------
# Server port — sourced from environment variable for dynamic assignment
# by ECS / EKS / Elastic Beanstalk (blocker-12: cr-java-0077)
# -----------------------------------------------------------------------
server.port=${SERVER_PORT:8080}

# -----------------------------------------------------------------------
# Datasource — credentials resolved from AWS Secrets Manager at runtime
# (blocker-8/9: cr-java-0069). Connection URL uses environment variable.
# -----------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------
# AWS Secrets Manager — secret names for DB and auth credentials
# (blocker-8/9: cr-java-0069, blocker-18: cr-java-0090)
# -----------------------------------------------------------------------
cloud.aws.secretsmanager.db-secret-name=${DB_SECRET_NAME:resortslite/db/credentials}
cloud.aws.secretsmanager.auth-secret-name=${AUTH_SECRET_NAME:resortslite/auth/credentials}

# -----------------------------------------------------------------------
# AWS SSM Parameter Store — parameter paths for environment URLs
# (blocker-10/11: cr-java-0071)
# -----------------------------------------------------------------------
cloud.aws.ssm.inventory-url-param=${INVENTORY_URL_PARAM:/resortslite/inventory/endpoint}
cloud.aws.ssm.report-url-param=${REPORT_URL_PARAM:/resortslite/report/download-url}

# -----------------------------------------------------------------------
# Amazon S3 — bucket and prefix for report storage
# (blocker-1/2/3/4/5/6/7: cr-java-0061, cr-java-0062, cr-java-0063)
# -----------------------------------------------------------------------
cloud.aws.s3.report-bucket=${REPORT_S3_BUCKET:resorts-reports-bucket}
cloud.aws.s3.report-prefix=${REPORT_S3_PREFIX:reports/}

# -----------------------------------------------------------------------
# AWS Region — required by all AWS SDK v2 clients
# -----------------------------------------------------------------------
cloud.aws.region.static=${AWS_REGION:us-east-1}

# -----------------------------------------------------------------------
# Amazon ElastiCache for Redis — Spring Session distributed store
# (blocker-13/14/15/16/17: cr-java-0065, blocker-20: cr-java-0067)
# -----------------------------------------------------------------------
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session

# Cache TTL for booking entries in Redis (seconds)
cache.booking.ttl-seconds=${BOOKING_CACHE_TTL:3600}

# -----------------------------------------------------------------------
# External service endpoints — injected via environment variables
# (blocker-10/11: cr-java-0071)
# -----------------------------------------------------------------------
PAYMENT_API_URL=${PAYMENT_API_URL:https://payment-svc.internal/charge}
INVENTORY_SERVICE_URL=${INVENTORY_SERVICE_URL:https://inventory-svc.internal/rooms}
