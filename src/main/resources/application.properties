# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0069 FIX: Azure Key Vault configuration for secure credential management.
# Set AZURE_KEYVAULT_URI to your Key Vault endpoint (e.g., https://<vault-name>.vault.azure.net/).
# DefaultAzureCredential will authenticate using Managed Identity in Azure App Service,
# or via environment variables / Azure CLI locally.
azure.keyvault.uri=${AZURE_KEYVAULT_URI:}
# Secret names stored in Azure Key Vault (override via environment variables if needed)
azure.keyvault.secret.db-host=${AZURE_KEYVAULT_SECRET_DB_HOST:db-host}
azure.keyvault.secret.db-user=${AZURE_KEYVAULT_SECRET_DB_USER:db-user}
azure.keyvault.secret.db-pass=${AZURE_KEYVAULT_SECRET_DB_PASS:db-pass}

# cr-java-0061 FIX: Azure Blob Storage configuration to replace hard-coded file paths.
# Set AZURE_STORAGE_CONNECTION_STRING environment variable in the cloud environment
# (e.g., Azure App Service Application Settings or Key Vault reference).
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=https;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OGLjX+N+bqaQFSSyXJ/lNegJkxUqYdqQ==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1}
azure.storage.reports-container=${AZURE_STORAGE_REPORTS_CONTAINER:resort-reports}
azure.storage.backup-container=${AZURE_STORAGE_BACKUP_CONTAINER:resort-backups}

# cr-java-0111 FIX: Azure Service Bus configuration for distributed, timezone-agnostic
# scheduled task execution. Replaces java.util.Timer and server-local scheduling.
# Set AZURE_SERVICEBUS_CONNECTION_STRING in Azure App Service Application Settings
# or reference it from Azure Key Vault. All scheduled message enqueue times are
# expressed in UTC (ZoneOffset.UTC) to ensure consistency across cloud regions.
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
# Queue name for scheduled report generation tasks
azure.servicebus.report-queue=${AZURE_SERVICEBUS_REPORT_QUEUE:resort-report-tasks}


# cr-java-0077 FIX: Replaced hard-coded port 8080 with environment variable SERVER_PORT.
# Set SERVER_PORT in Azure App Service Application Settings or Azure App Configuration.
# Falls back to 8080 for local development if SERVER_PORT is not set.
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0071 FIX: Externalized hard-coded environment URL for inventory availability check.
# Previously hard-coded as "http://inventory-service.internal:8081/rooms/available" in
# BookingController.java (line 66). Now sourced from Azure App Configuration via the
# APP_INVENTORY_AVAILABLE_URL environment variable, enabling environment-agnostic deployments.
# Set APP_INVENTORY_AVAILABLE_URL in Azure App Service Application Settings or Azure App Configuration.
app.inventory.available.url=${APP_INVENTORY_AVAILABLE_URL:${app.inventory.endpoint}/available}

# cr-java-0065 FIX: Azure Cache for Redis configuration to replace in-process HTTP session storage.
# Set AZURE_REDIS_HOST and AZURE_REDIS_PASSWORD in Azure App Service Application Settings
# or reference them from Azure Key Vault. This enables stateless session management
# across all horizontally-scaled application instances.
spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6379}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.redis.ssl=${AZURE_REDIS_SSL:false}
# Use Redis as the Spring Session store
spring.session.store-type=redis
# Session timeout (matches the SESSION_TTL_MINUTES constant in BookingController)
spring.session.timeout=30m
# Redis namespace for Spring Session keys
spring.session.redis.namespace=spring:session:resortsLite

# cr-java-0067 FIX: Azure Cache for Redis booking cache TTL configuration.
# Replaces the former static in-memory HashMap (bookingCache) in BookingController
# which had no expiration policy, caused indefinite memory growth, and was
# instance-local (invisible to other horizontally-scaled instances).
# Each booking entry is stored in Redis with an explicit TTL to prevent stale data
# and memory exhaustion. Set BOOKING_CACHE_TTL_HOURS in Azure App Service Application
# Settings or Azure App Configuration to override the default of 24 hours.
booking.cache.ttl.hours=${BOOKING_CACHE_TTL_HOURS:24}
# Redis key namespace for booking cache entries
booking.cache.key.prefix=booking:cache:

# cr-java-0090 FIX: Azure Active Directory (Entra ID) configuration for Spring Security
# OAuth2 resource server. Replaces file-based authentication with centralized Azure AD
# identity management. The application validates incoming JWT access tokens issued by
# Azure AD using the tenant's JWKS endpoint, eliminating local credential file storage.
#
# Set the following in Azure App Service Application Settings or Azure App Configuration:
#   AZURE_AD_TENANT_ID  - Your Azure AD tenant ID (GUID)
#   AZURE_AD_CLIENT_ID  - The application (client) ID registered in Azure AD
#
# Azure AD tenant and client identifiers (required for JWT validation)
spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.credential.client-id=${AZURE_AD_CLIENT_ID:}
spring.cloud.azure.active-directory.profile.tenant-id=${AZURE_AD_TENANT_ID:}
# Configure the app as an OAuth2 resource server (validates Bearer JWT tokens)
spring.cloud.azure.active-directory.application-type=resource-server
# Spring Security OAuth2 resource server JWT issuer URI derived from tenant ID
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${AZURE_AD_TENANT_ID:common}/v2.0
