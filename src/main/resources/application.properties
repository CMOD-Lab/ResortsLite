# ResortsLite - Cloud-Native Configuration
# All environment-specific values are injected via environment variables or
# retrieved at runtime from AWS Systems Manager Parameter Store / Secrets Manager.

spring.application.name=ResortsLite

# Server port: read from environment variable PORT (injected by ECS/EKS/Elastic Beanstalk).
# Falls back to 8080 for local development.
server.port=${PORT:8080}

# -----------------------------------------------------------------------
# Database — credentials are fetched at runtime from AWS Secrets Manager.
# The application resolves the secret name via the DB_SECRET_NAME env var.
# -----------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------
# AWS region — required by all AWS SDK v2 clients
# -----------------------------------------------------------------------
aws.region=${AWS_REGION:us-east-1}

# -----------------------------------------------------------------------
# AWS Secrets Manager — secret name that holds DB credentials JSON
# -----------------------------------------------------------------------
aws.secretsmanager.db-secret-name=${DB_SECRET_NAME:resortslite/db/credentials}

# -----------------------------------------------------------------------
# AWS Systems Manager Parameter Store — parameter paths for service URLs
# -----------------------------------------------------------------------
aws.ssm.payment-endpoint-param=${PAYMENT_ENDPOINT_PARAM:/resortslite/payment/endpoint}
aws.ssm.inventory-endpoint-param=${INVENTORY_ENDPOINT_PARAM:/resortslite/inventory/endpoint}
aws.ssm.notification-endpoint-param=${NOTIFICATION_ENDPOINT_PARAM:/resortslite/notification/endpoint}
aws.ssm.report-service-url-param=${REPORT_SERVICE_URL_PARAM:/resortslite/report/service-url}

# -----------------------------------------------------------------------
# Amazon S3 — bucket for report storage (replaces local /var/legacy/reports)
# -----------------------------------------------------------------------
aws.s3.report-bucket=${REPORT_S3_BUCKET:resortslite-reports}
aws.s3.report-prefix=${REPORT_S3_PREFIX:monthly-reports/}

# -----------------------------------------------------------------------
# Amazon ElastiCache for Redis — Spring Session distributed store
# -----------------------------------------------------------------------
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=resortslite:session
