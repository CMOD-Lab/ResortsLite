# ResortsLite - PostgreSQL-Compatible Configuration
spring.application.name=ResortsLite

# Server port — use environment variable for cloud/container deployments (ECS/EKS dynamic port binding)
server.port=${SERVER_PORT:8080}

# PostgreSQL DataSource Configuration
# Connection URL externalised to environment variable for cloud deployment (AWS Parameter Store / Secrets Manager)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resortdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings (HikariCP — Spring Boot default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate settings for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# H2 console disabled — not applicable for PostgreSQL
# spring.h2.console.enabled=false

# External service endpoints — externalised to environment variables for cloud VPC routing
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal:7070/send}

# Report storage — externalised to environment variable; use S3/cloud object storage in production
app.report.base.path=${REPORT_BASE_PATH:/tmp/reports/}
