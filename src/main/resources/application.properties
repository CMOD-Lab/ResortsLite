# ResortsLite - Cloud-Native Configuration
# All environment-specific values are injected via environment variables or
# retrieved from AWS Systems Manager Parameter Store / Secrets Manager at runtime.

spring.application.name=ResortsLite

# Blocker-12 (cr-java-0077): Port sourced from SERVER_PORT environment variable —
# allows ECS/EKS/Elastic Beanstalk to assign ports dynamically.
server.port=${SERVER_PORT:8080}

# Database — credentials are fetched from AWS Secrets Manager at runtime (blockers 8/9).
# The JDBC URL host is injected via DB_HOST environment variable.
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# AWS Secrets Manager — secret names for DB and auth credentials (blockers 8/9/18)
cloud.aws.secretsmanager.db-secret-name=${DB_SECRET_NAME:resortslite/db/credentials}
cloud.aws.secretsmanager.auth-secret-name=${AUTH_SECRET_NAME:resortslite/auth/credentials}

# Amazon S3 — bucket for report storage (blockers 1-7)
cloud.aws.s3.reports-bucket=${REPORTS_S3_BUCKET:resorts-lite-reports}

# AWS SSM Parameter Store — parameter paths for environment URLs (blockers 10/11)
app.inventory.url.param=${INVENTORY_URL_PARAM:/resortslite/inventory/url}
app.reports.download.url.param=${REPORTS_URL_PARAM:/resortslite/reports/download-url}

# Payment API endpoint — injected via environment variable (blocker-18)
PAYMENT_API_URL=${PAYMENT_API_URL:https://payment-service.internal/payments/charge}

# Amazon ElastiCache for Redis — Spring Session distributed session store (blockers 13-17/20)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session

# Booking cache TTL in minutes (blocker-20)
app.cache.booking.ttl-minutes=${BOOKING_CACHE_TTL_MINUTES:30}

# AWS region — required by AWS SDK v2
cloud.aws.region.static=${AWS_REGION:us-east-1}
