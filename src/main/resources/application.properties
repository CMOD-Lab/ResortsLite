# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
# cr-java-0077 FIX: Hard-coded port 8080 replaced with environment variable injection.
# The SERVER_PORT environment variable is injected at runtime by the AWS deployment platform:
#   - ECS: set SERVER_PORT in the task definition's environment block (sourced from SSM
#          Parameter Store parameter /resortslite/server/port via valueFrom)
#   - EKS: set SERVER_PORT in the pod spec env section (sourced from a ConfigMap or SSM)
#   - Elastic Beanstalk: set SERVER_PORT in the environment properties panel
# Falls back to 8080 for local development when SERVER_PORT is not set.
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0061 FIX: Amazon S3 configuration replacing hardcoded file paths.
# Override these via environment variables AWS_S3_REPORTS_BUCKET, AWS_S3_BACKUP_BUCKET,
# and AWS_REGION at deployment time (e.g., ECS task definition environment variables).
aws.s3.reports.bucket=${AWS_S3_REPORTS_BUCKET:resort-reports-bucket}
aws.s3.backup.bucket=${AWS_S3_BACKUP_BUCKET:resort-backup-bucket}
aws.region=${AWS_REGION:us-east-1}

# cr-java-0069 FIX: AWS Secrets Manager configuration for database credentials.
# Hard-coded DB_USER ("admin") and DB_PASS ("Resort$Pass#2019!") have been removed
# from BookingService.java. At runtime, AwsSecretsManagerConfig fetches the secret
# identified by AWS_DB_SECRET_NAME from AWS Secrets Manager. The secret must be a
# JSON object with keys "username", "password", and optionally "host".
# For local development, set DB_USER and DB_PASS environment variables instead.
app.db.secret.name=${AWS_DB_SECRET_NAME:resortslite/db/credentials}

# cr-java-0071 FIX: Externalized environment-specific URLs via AWS Systems Manager Parameter Store.
# These values replace hard-coded URLs in BookingController.java (line 66) and
# ReportService.java (line 66). At deployment time, override these properties using
# AWS SSM Parameter Store parameters:
#   /resortslite/inventory/url  -> app.inventory.url
#   /resortslite/reports/base-url -> app.reports.base-url
# For ECS/EKS deployments, inject the resolved SSM values as environment variables
# APP_INVENTORY_URL and APP_REPORTS_BASE_URL respectively.
app.inventory.url=${APP_INVENTORY_URL:http://inventory-service.internal:8081/rooms/available}
app.reports.base-url=${APP_REPORTS_BASE_URL:https://reports.resorts-internal.com/download/}

# cr-java-0065 FIX: Amazon ElastiCache for Redis configuration for distributed HTTP session
# storage via Spring Session. All application instances share session data through Redis,
# eliminating server affinity and enabling stateless horizontal scaling behind the AWS ALB.
# Override SPRING_REDIS_HOST with the ElastiCache primary endpoint at deployment time:
#   - ECS: set SPRING_REDIS_HOST in the task definition environment block
#   - EKS: set SPRING_REDIS_HOST in the pod spec env section (from a ConfigMap or SSM)
#   - Elastic Beanstalk: set SPRING_REDIS_HOST in the environment properties panel
# Falls back to localhost for local development when the variable is not set.
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.password=${SPRING_REDIS_PASSWORD:}
spring.redis.ssl=${SPRING_REDIS_SSL:false}
# Session TTL: 30 minutes (aligned with default Spring Session timeout)
spring.session.redis.flush-mode=on-save
spring.session.timeout=1800

# cr-java-0090 FIX: Amazon Cognito configuration for cloud-native user identity management.
# Replaces file-based authentication — all user credentials and identity data are stored
# in and retrieved from the Amazon Cognito User Pool. No local files or hardcoded credential
# constants are used for authentication.
#
# Override these via environment variables at deployment time:
#   AWS_COGNITO_USER_POOL_ID  – Cognito User Pool ID (e.g., us-east-1_AbCdEfGhI)
#   AWS_COGNITO_CLIENT_ID     – Cognito App Client ID
#
# Deployment guidance:
#   - ECS: set AWS_COGNITO_USER_POOL_ID and AWS_COGNITO_CLIENT_ID in the task definition
#          environment block (sourced from SSM Parameter Store via valueFrom)
#   - EKS: set in the pod spec env section (from a ConfigMap or SSM Parameter Store)
#   - Elastic Beanstalk: set in the environment properties panel
#
# Required IAM permissions for the application's execution role:
#   cognito-idp:AdminGetUser
#   cognito-idp:GetUser
aws.cognito.user-pool-id=${AWS_COGNITO_USER_POOL_ID:}
aws.cognito.client-id=${AWS_COGNITO_CLIENT_ID:}

# cr-java-0067 FIX: Amazon ElastiCache for Redis booking cache TTL configuration.
# Replaces the former unbounded static HashMap (bookingCache) in BookingController.java.
# All booking cache entries are stored in Redis with a configurable TTL to prevent
# indefinite memory growth and stale data inconsistencies across multiple instances.
#
# Override via environment variable at deployment time:
#   BOOKING_CACHE_TTL_SECONDS – TTL in seconds for each booking cache entry
#
# Deployment guidance:
#   - ECS: set BOOKING_CACHE_TTL_SECONDS in the task definition environment block
#   - EKS: set in the pod spec env section (from a ConfigMap or SSM Parameter Store)
#   - Elastic Beanstalk: set in the environment properties panel
# Default: 1800 seconds (30 minutes), aligned with the Spring Session timeout.
app.booking.cache.ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:1800}
