# ResortsLite - Cloud-Native Configuration (GCP)
# All sensitive values should be stored in GCP Secret Manager and referenced via
# spring.config.import=sm:// (bootstrap.properties) or environment variables.

spring.application.name=ResortsLite

# ─── Server Port ──────────────────────────────────────────────────────────────
# blocker-12: Port is now driven by the PORT environment variable (Cloud Run default).
# Falls back to 8080 for local development.
server.port=${PORT:8080}

# ─── Datasource ───────────────────────────────────────────────────────────────
# blocker-8, blocker-9: Credentials are no longer hard-coded.
# In production, set DB_URL, DB_USER, DB_PASS as Cloud Run environment variables
# or reference GCP Secret Manager secrets:
#   spring.datasource.password=${sm://db-password}
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── Google Cloud Storage ─────────────────────────────────────────────────────
# blocker-1, blocker-2, blocker-3, blocker-4, blocker-5, blocker-6, blocker-7:
# GCS bucket names replace all hard-coded local file paths.
# Set GCS_REPORT_BUCKET_NAME and GCS_BACKUP_BUCKET_NAME as environment variables
# or store them in GCP Secret Manager.
gcs.report.bucket.name=${GCS_REPORT_BUCKET_NAME:resorts-reports-bucket}
gcs.backup.bucket.name=${GCS_BACKUP_BUCKET_NAME:resorts-backup-bucket}

# ─── Spring Session — Google Cloud Memorystore for Redis ──────────────────────
# blocker-13, blocker-14, blocker-15, blocker-16, blocker-17, blocker-20:
# HTTP session state and in-memory cache replaced with Redis (Memorystore).
# Set REDIS_HOST and REDIS_PORT as Cloud Run / GKE environment variables.
spring.session.store-type=redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session

# ─── Service Endpoints ────────────────────────────────────────────────────────
# blocker-10, blocker-11: All hard-coded URLs replaced with environment variables.
# Sensitive endpoints can be stored in GCP Secret Manager:
#   app.payment.endpoint=${sm://payment-api-url}
app.payment.endpoint=${PAYMENT_API_URL:https://payment-svc.internal/charge}
app.inventory.endpoint=${INVENTORY_URL:https://inventory-service.internal:8081/rooms/available}
app.notification.endpoint=${NOTIFICATION_URL:https://notify.internal/send}
app.report.download.url=${REPORT_DOWNLOAD_URL:https://reports.resorts-internal.com/download}

# ─── Spring Cloud GCP ─────────────────────────────────────────────────────────
# Set GCP_PROJECT_ID as an environment variable or rely on Application Default Credentials.
spring.cloud.gcp.project-id=${GCP_PROJECT_ID:}
