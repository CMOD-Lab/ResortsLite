# ResortsLite - Cloud-Ready Configuration (Azure)
spring.application.name=ResortsLite

# cr-java-0077: Server port externalized to environment variable.
# Set SERVER_PORT environment variable in Azure App Service / Container Apps.
server.port=${SERVER_PORT:8080}

# Database configuration — credentials managed via Azure Key Vault (cr-java-0069)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# cr-java-0069: Azure Key Vault endpoint for secret retrieval.
# Set AZURE_KEY_VAULT_ENDPOINT to your Key Vault URI, e.g.:
#   https://<your-vault-name>.vault.azure.net/
# Secrets expected in Key Vault:
#   db-host          -> database hostname
#   db-user          -> database username
#   db-pass          -> database password
#   payment-api-url  -> payment service endpoint URL
AZURE_KEY_VAULT_ENDPOINT=${AZURE_KEY_VAULT_ENDPOINT:}

# cr-java-0061, cr-java-0062, cr-java-0063: Azure Blob Storage for file operations.
# Set AZURE_STORAGE_CONNECTION_STRING to your storage account connection string.
AZURE_STORAGE_CONNECTION_STRING=${AZURE_STORAGE_CONNECTION_STRING:}
AZURE_BLOB_CONTAINER_NAME=${AZURE_BLOB_CONTAINER_NAME:resort-reports}
AZURE_BACKUP_CONTAINER=${AZURE_BACKUP_CONTAINER:resort-backups}

# cr-java-0071: Azure App Configuration endpoint for externalized URLs.
# Set AZURE_APP_CONFIG_ENDPOINT to your App Configuration endpoint URI, e.g.:
#   https://<your-appconfig-name>.azconfig.io
# Keys expected in App Configuration:
#   inventory.service.url    -> inventory service HTTPS URL
#   report.download.base.url -> report download base HTTPS URL
AZURE_APP_CONFIG_ENDPOINT=${AZURE_APP_CONFIG_ENDPOINT:}

# cr-java-0071: Fallback environment variable for inventory service URL
INVENTORY_SERVICE_URL=${INVENTORY_SERVICE_URL:https://inventory-service.internal:8081/rooms/available}

# cr-java-0071: Fallback environment variable for report download base URL
REPORT_DOWNLOAD_BASE_URL=${REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download}

# cr-java-0065, cr-java-0067: Azure Cache for Redis — session state and distributed caching.
# Set AZURE_REDIS_HOST and AZURE_REDIS_PASSWORD from Azure Portal / Key Vault.
spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6380}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.redis.ssl=${AZURE_REDIS_SSL:true}

# Spring Session backed by Redis (cr-java-0065)
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=spring:session

# Booking cache TTL in minutes (cr-java-0067)
BOOKING_CACHE_TTL_MINUTES=${BOOKING_CACHE_TTL_MINUTES:30}

# cr-java-0111: Azure Service Bus for distributed scheduled task execution.
# Set AZURE_SERVICE_BUS_CONNECTION_STRING from Azure Portal / Key Vault.
AZURE_SERVICE_BUS_CONNECTION_STRING=${AZURE_SERVICE_BUS_CONNECTION_STRING:}
AZURE_SERVICE_BUS_QUEUE_NAME=${AZURE_SERVICE_BUS_QUEUE_NAME:report-scheduler-queue}

# cr-java-0090: Azure Active Directory (Entra ID) configuration for Spring Security.
# Set AZURE_AD_TENANT_ID and AZURE_AD_CLIENT_ID from Azure Portal.
spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.profile.tenant-id=${AZURE_AD_TENANT_ID:}
spring.cloud.azure.active-directory.credential.client-id=${AZURE_AD_CLIENT_ID:}
spring.cloud.azure.active-directory.credential.client-secret=${AZURE_AD_CLIENT_SECRET:}
