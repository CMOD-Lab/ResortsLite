# Test datasource — uses H2 in-memory DB instead of PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable PostgreSQL auto-configuration for tests
spring.autoconfigure.exclude=

# Application properties for tests
app.payment.endpoint=https://payment-svc.internal/charge
app.inventory.endpoint=https://inventory-svc.internal/rooms
app.report.base-path=/tmp/test-reports/
app.backup.path=/tmp/test-backups/
server.port=8080

# Suppress banner in tests
spring.main.banner-mode=off
logging.level.root=WARN
