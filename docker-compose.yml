version: "3.9"

# =============================================================================
# docker-compose.yml – ResortsLite BookingComp (application only)
# External services (Redis, DB) are provided separately via environment vars.
# =============================================================================

services:
  bookingcomp:
    image: bookingcomp:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookingcomp
    ports:
      - "8080:8080"   # Application port
      - "8081:8081"   # Actuator / management port
    environment:
      # Spring
      SPRING_PROFILES_ACTIVE: docker
      # JVM
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom"
      # Server
      SERVER_PORT: "8080"
      MANAGEMENT_PORT: "8081"
      # Redis / Spring Session (point to your Redis instance)
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-6379}
      # External service endpoints
      PAYMENT_API_URL: ${PAYMENT_API_URL:-http://payment-service:9090/payments/charge}
      # File paths
      REPORT_BASE_PATH: /reports
      BACKUP_PATH: /backups/nightly
      # Booking cache
      BOOKING_CACHE_MAX_SIZE: "500"
      # Timezone
      TZ: UTC
    volumes:
      - reports-data:/reports
      - backups-data:/backups/nightly
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  reports-data:
    driver: local
  backups-data:
    driver: local

networks:
  app-network:
    driver: bridge
