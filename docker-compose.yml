version: "3.8"

services:
  bookingcomp:
    image: bookingcomp:latest
    container_name: bookingcomp
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: "8080"
      # Redis / ElastiCache — override with real values for local dev
      REDIS_HOST: ${REDIS_HOST:-localhost}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Path configuration
      REPORT_BASE_PATH: ${REPORT_BASE_PATH:-/var/reports}
      BACKUP_PATH: ${BACKUP_PATH:-/var/backups/nightly}
      # External service endpoints
      PAYMENT_API_URL: ${PAYMENT_API_URL:-http://payment-service/payments/charge}
      # JVM options
      JAVA_OPTS: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
    volumes:
      - reports-data:/var/reports
      - backups-data:/var/backups/nightly
    networks:
      - app-network
    restart: unless-stopped

volumes:
  reports-data:
  backups-data:

networks:
  app-network:
    driver: bridge
