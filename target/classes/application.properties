# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# blocker-4/5/6/7/8 (cz-java-0063) & blocker-13 (cz-java-0070):
# Redis connection for Spring Session (ElastiCache on EKS) — values injected via ConfigMap/Secrets.
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.session.store-type=redis
spring.session.redis.flush-mode=on_save
spring.session.redis.namespace=spring:session

# blocker-1/2/3 (cz-java-0057): Absolute file paths — injected via Kubernetes ConfigMap on EKS.
REPORT_BASE_PATH=${REPORT_BASE_PATH:/var/reports}
BACKUP_PATH=${BACKUP_PATH:/var/backups/nightly}

# blocker-11 (cz-java-0061): Server port — injected via Kubernetes ConfigMap on EKS.
SERVER_PORT=${SERVER_PORT:8080}

# blocker-12 (cz-java-0062): Payment API URL — injected via Kubernetes ConfigMap on EKS.
PAYMENT_API_URL=${PAYMENT_API_URL:http://payment-service/payments/charge}

# health-check-endpoint: Expose Spring Boot Actuator health endpoint for Kubernetes
# liveness and readiness probes on EKS.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.redis.enabled=true
