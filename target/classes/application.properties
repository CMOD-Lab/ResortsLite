# ResortsLite - Application Configuration
spring.application.name=ResortsLite

# Server port — externalised to environment variable for cloud/container compatibility.
# Container orchestration (ECS/EKS) dynamically assigns ports; use PORT env var or default 8080.
server.port=${PORT:8080}

# PostgreSQL 16 DataSource Configuration
# Connection parameters are externalised to environment variables to avoid hardcoding
# credentials in source code (fixes sec-cred-001, cr-java-0021).
# Set DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASS in AWS Parameter Store / Secrets Manager
# or as container environment variables before deployment.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:resortdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings (HikariCP — Spring Boot default)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# PostgreSQL dialect for JdbcTemplate / schema initialisation
spring.sql.init.platform=postgresql

# Schema initialisation — create tables on startup if they do not exist
spring.sql.init.mode=always

# External service endpoints — externalised to environment variables (fixes cr-java-0021, cr-java-0088).
# All inter-service communication must use HTTPS in cloud environments.
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify-svc/send}

# Report storage — externalised to environment variable (fixes czr-java-001).
# In containerised deployments use a mounted volume or cloud object storage (S3 / Azure Blob).
app.report.base-path=${REPORT_BASE_PATH:/tmp/reports/}
