# ResortsLite — Application Configuration
# Java 21 / Spring Boot 3.2.x compatible

spring.application.name=ResortsLite

# Server port — override via SERVER_PORT env var for ECS/EKS dynamic port assignment
server.port=${SERVER_PORT:8080}

# ============================================================
# Database — H2 in-memory for development/testing
# Fix: Hardcoded DB credentials replaced with environment-variable placeholders.
# For production, supply DB_URL, DB_USER, DB_PASS via AWS Parameter Store /
# Secrets Manager and set spring.datasource.* accordingly.
# ============================================================
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# Internal service endpoints
# Fix: Plain HTTP URLs replaced with HTTPS; values resolved from env vars
# so they can be overridden per environment without code changes.
# ============================================================
app.payment.endpoint=${PAYMENT_API:https://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_SERVICE_URL:https://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_SERVICE_URL:https://notify.internal:7070/send}

# ============================================================
# Report configuration
# Fix: Hardcoded absolute file paths replaced with env-var-driven values.
# ============================================================
app.report.base-path=${REPORT_BASE_PATH:/var/reports/}
app.report.backup-path=${BACKUP_PATH:/var/backups/}
app.report.host=${REPORT_HOST:reports.resorts-internal.com}
