# ResortsLite - Application Configuration
spring.application.name=ResortsLite

# ─────────────────────────────────────────────────────────────────────────────
# Server
# ─────────────────────────────────────────────────────────────────────────────
# Server port resolved from environment variable to support dynamic assignment
# by container orchestrators (ECS / EKS / Kubernetes).
server.port=${SERVER_PORT:8080}

# ─────────────────────────────────────────────────────────────────────────────
# Datasource — credentials injected via environment variables.
# In production, supply DB_URL, DB_USER, and DB_PASS via:
#   • AWS Secrets Manager / Parameter Store
#   • Kubernetes Secrets
#   • ECS task-definition environment variables
# ─────────────────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=org.h2.Driver

# ─────────────────────────────────────────────────────────────────────────────
# H2 Console (development only — disable in production)
# ─────────────────────────────────────────────────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─────────────────────────────────────────────────────────────────────────────
# Internal service endpoints — externalised for cloud-native deployment.
# Override via ECS task-definition environment variables or Kubernetes ConfigMaps.
# All endpoints use HTTPS to enforce transport-layer encryption.
# ─────────────────────────────────────────────────────────────────────────────
app.payment.endpoint=${PAYMENT_API_URL:https://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_API_URL:https://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_API_URL:https://notify.internal:7070/send}

# ─────────────────────────────────────────────────────────────────────────────
# Report storage — externalised for container portability (S3 / EFS / temp dir).
# ─────────────────────────────────────────────────────────────────────────────
app.report.base-path=${REPORT_BASE_PATH:${java.io.tmpdir}/reports}
