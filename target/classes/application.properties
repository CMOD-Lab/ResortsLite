# ResortsLite - Application Configuration
spring.application.name=ResortsLite

# [DB_MIGRATION_POSTGRESQL / PORTABILITY]: Server port externalised to environment variable.
# Container orchestration (ECS/EKS) dynamically assigns ports. Use PORT env var with
# fallback to 8080 for local development. Resolves czr-port-001.
server.port=${PORT:8080}

# [DB_MIGRATION_POSTGRESQL]: Converted H2 in-memory datasource to PostgreSQL 16.
# Connection parameters are externalised to environment variables so that credentials
# are never stored in source code or version control (resolves cr-java-0021, sec-cred-001).
# For production, inject these via AWS Parameter Store / Secrets Manager or Kubernetes Secrets.
#
# Required environment variables:
#   DB_HOST     - PostgreSQL server hostname  (e.g. resortdb.cluster-xyz.us-east-1.rds.amazonaws.com)
#   DB_PORT     - PostgreSQL server port      (default: 5432)
#   DB_NAME     - Database / schema name      (e.g. resortdb)
#   DB_USER     - Database username
#   DB_PASSWORD - Database password
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:resortdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# [DB_MIGRATION_POSTGRESQL]: Connection pool settings tuned for PostgreSQL 16.
# HikariCP (Spring Boot default) is used; these values are safe defaults for a
# small-to-medium workload and can be overridden via environment variables.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}

# [DB_MIGRATION_POSTGRESQL]: H2 console removed — not applicable for PostgreSQL.
# Use pgAdmin, DBeaver, or psql CLI to inspect the PostgreSQL database.

# [PORTABILITY / CLOUD_COMPATIBILITY]: Internal service endpoints externalised to
# environment variables. Hardcoded hostnames are non-routable in cloud VPC environments
# and break on redeployment or auto-scaling (resolves cr-java-0021, cr-java-0088).
#
# Required environment variables:
#   PAYMENT_ENDPOINT      - Payment service base URL  (must use HTTPS in production)
#   INVENTORY_ENDPOINT    - Inventory service base URL (must use HTTPS in production)
#   NOTIFICATION_ENDPOINT - Notification service base URL (must use HTTPS in production)
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal/send}

# [PORTABILITY]: Report storage path externalised to environment variable.
# /var/legacy/reports does not exist inside a container image. Use an environment
# variable pointing to a mounted volume or cloud object storage path (resolves czr-java-001).
app.report.base-path=${REPORT_BASE_PATH:/tmp/reports/}
