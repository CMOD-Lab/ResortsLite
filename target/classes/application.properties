# ResortsLite - Application Configuration
spring.application.name=ResortsLite

# Server port — externalised to environment variable for cloud/container compatibility.
# Container orchestration (ECS/EKS) can override via PORT env var; defaults to 8080.
server.port=${PORT:8080}

# -----------------------------------------------------------------------
# PostgreSQL DataSource Configuration
# Updated: Replaced H2 in-memory datasource with PostgreSQL 16 connection.
# All sensitive values (host, credentials) are externalised to environment
# variables so they can be injected via AWS Parameter Store / Secrets Manager
# or Kubernetes Secrets — never hardcoded in source.
# -----------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resortdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool settings (HikariCP — Spring Boot default)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# PostgreSQL-specific: disable auto-commit for explicit transaction control
spring.datasource.hikari.auto-commit=false

# Schema initialisation — create tables on startup if they do not exist
spring.sql.init.mode=always
spring.sql.init.platform=postgresql

# -----------------------------------------------------------------------
# External service endpoints — externalised to environment variables.
# Updated: Replaced hardcoded internal hostnames with env-var references
# so endpoints can be configured per environment (dev / staging / prod)
# without code changes. HTTPS enforced for cloud security compliance.
# -----------------------------------------------------------------------
app.payment.endpoint=${PAYMENT_ENDPOINT:https://payment-svc.internal:9090/charge}
app.inventory.endpoint=${INVENTORY_ENDPOINT:https://inventory-svc.internal:8081/rooms}
app.notification.endpoint=${NOTIFICATION_ENDPOINT:https://notify.internal:7070/send}
