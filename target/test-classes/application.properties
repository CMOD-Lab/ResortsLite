# Test configuration — uses H2 in-memory database instead of PostgreSQL
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable Spring Boot auto-configuration for PostgreSQL in tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# Application properties for tests
app.inventory.endpoint=https://inventory-svc.internal/rooms
app.report.base-path=/tmp/reports/
app.backup.path=/tmp/resort-backups/
app.payment.endpoint=https://payment-svc.internal/charge
server.port=8080
